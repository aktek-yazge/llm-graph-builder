# =============================================================================
# WAT - Firma Servisleri
# =============================================================================
# KULLANIM:
#   docker compose -p wat -f docker-compose.wat.yml up -d
#   docker compose -p wat -f docker-compose.wat.yml down
#
# ERİŞİM (Subdomain Routing):
#   Neo4j Browser: http://wat.dev.local (otomatik Bolt bağlantısı)
#   pgAdmin:       http://wat.dev.local/pgadmin
#   Redis:         http://localhost:8001 (RedisInsight)
# =============================================================================

services:
  # ===========================================================================
  # WAT - Neo4j Graph Database
  # ===========================================================================
  neo4j:
    image: neo4j:2025.07.1
    container_name: wat-neo4j
    restart: always
    expose:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=neo4j/${WAT_NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      # Subdomain routing için advertised address ayarları
      # Browser: wat.dev.local (HTTP)
      # Bolt: neo4j.wat.dev.local:80 (WebSocket)
      - NEO4J_server_default__advertised__address=wat.dev.local
      - NEO4J_server_bolt_advertised__address=neo4j.wat.dev.local:80
      - NEO4J_server_http_advertised__address=:80
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4"
    volumes:
      - wat_neo4j_data:/data
      - wat_neo4j_plugins:/plugins
      - wat_neo4j_import:/var/lib/neo4j/import
    networks:
      - wat-dev-network
    labels:
      - "traefik.enable=true"
      # =========================================================================
      # Neo4j Browser (HTTP) - wat.dev.local
      # =========================================================================
      - "traefik.http.routers.wat-neo4j.rule=Host(`wat.dev.local`)"
      - "traefik.http.routers.wat-neo4j.entrypoints=web"
      - "traefik.http.routers.wat-neo4j.priority=10"
      - "traefik.http.routers.wat-neo4j.service=wat-neo4j-browser"
      - "traefik.http.services.wat-neo4j-browser.loadbalancer.server.port=7474"
      # =========================================================================
      # Neo4j Bolt (WebSocket) - aynı subdomain üzerinden
      # =========================================================================
      - "traefik.http.routers.wat-bolt.rule=Host(`neo4j.wat.dev.local`)"
      - "traefik.http.routers.wat-bolt.entrypoints=web"
      - "traefik.http.routers.wat-bolt.service=wat-neo4j-bolt"
      - "traefik.http.services.wat-neo4j-bolt.loadbalancer.server.port=7687"

  # ===========================================================================
  # WAT - Redis Cache
  # ===========================================================================
  redis:
    image: redis/redis-stack:latest
    container_name: wat-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    volumes:
      - wat_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - wat-dev-network

  # ===========================================================================
  # WAT - PostgreSQL Database
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wat-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${WAT_POSTGRES_PASSWORD}
      - POSTGRES_DB=llm_graph_builder
    command: postgres -c max_connections=2000 -c shared_buffers=256MB
    volumes:
      - wat_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - wat-dev-network

  # ===========================================================================
  # WAT - pgAdmin (PostgreSQL Yönetimi)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wat-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@wat.com
      - PGADMIN_DEFAULT_PASSWORD=${WAT_PGADMIN_PASSWORD:-admin}
      - SCRIPT_NAME=/pgadmin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - wat_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - wat-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wat-pgadmin.rule=Host(`wat.dev.local`) && PathPrefix(`/pgadmin`)"
      - "traefik.http.routers.wat-pgadmin.entrypoints=web"
      - "traefik.http.routers.wat-pgadmin.priority=20"
      - "traefik.http.services.wat-pgadmin.loadbalancer.server.port=80"
    restart: always

volumes:
  wat_neo4j_data:
    external: true
    name: wat_neo4j_data
  wat_neo4j_plugins:
    external: true
    name: wat_neo4j_plugins
  wat_neo4j_import:
    external: true
    name: wat_neo4j_import
  wat_postgres_data:
    external: true
    name: wat_postgres_data
  wat_redis_data:
    name: wat_redis_data
  wat_pgadmin_data:
    name: wat_pgadmin_data

networks:
  wat-dev-network:
    external: true
    name: wat-dev-network
