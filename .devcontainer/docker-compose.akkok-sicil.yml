# =============================================================================
# AKKOK-SİCİL - Firma Servisleri
# =============================================================================
# ÖN KOŞUL:
#   cp .env.example .env  # Şifreleri .env dosyasında ayarlayın
#
# KULLANIM:
#   docker compose -p akkok-sicil -f docker-compose.akkok-sicil.yml up -d
#   docker compose -p akkok-sicil -f docker-compose.akkok-sicil.yml down
#
# ERİŞİM (Subdomain Routing):
#   Neo4j Browser: http://neo4j.akkok-sicil.dev.local
#   pgAdmin:       http://pgadmin.akkok-sicil.dev.local
#   Flower:        http://flower.akkok-sicil.dev.local
#   Frontend:      http://akkok-sicil.dev.local
#   Backend:       http://server.akkok-sicil.dev.local
#
# NOT: Backend/Frontend devcontainer içinden manuel başlatılır
# =============================================================================

services:
  # ===========================================================================
  # AKKOK-SİCİL - Neo4j Graph Database
  # ===========================================================================
  neo4j:
    image: neo4j:2025.07.1
    container_name: akkok-sicil-neo4j
    restart: always
    expose:
      - "7474"
      - "7687"
    ports:
      - "17474:7474"  # HTTP Browser direct access (port 17474)
      - "17687:7687"  # Bolt direct access (port 17687)
    environment:
      - NEO4J_AUTH=neo4j/${AKKOK_NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      # Subdomain routing için advertised address ayarları
      # Browser: akkok-sicil.dev.local (HTTP)
      # Bolt: neo4j.akkok-sicil.dev.local:80 (WebSocket)
      - NEO4J_server_default__advertised__address=akkok-sicil.dev.local
      - NEO4J_server_bolt_advertised__address=neo4j.akkok-sicil.dev.local:80
      - NEO4J_server_http_advertised__address=:80
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"
    volumes:
      - akkok_sicil_neo4j_data:/data
      - akkok_sicil_neo4j_plugins:/plugins
      - akkok_sicil_neo4j_import:/var/lib/neo4j/import
    networks:
      - akkok-sicil-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=akkok-sicil-dev-network"
      # =========================================================================
      # CORS Middleware (Neo4j Browser Preview için gerekli)
      # =========================================================================
      - "traefik.http.middlewares.neo4j-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.neo4j-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.neo4j-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.neo4j-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.neo4j-cors.headers.addvaryheader=true"
      # =========================================================================
      # Neo4j Browser (HTTP) - neo4j.akkok-sicil.dev.local
      # =========================================================================
      - "traefik.http.routers.akkok-sicil-neo4j.rule=Host(`neo4j.akkok-sicil.dev.local`)"
      - "traefik.http.routers.akkok-sicil-neo4j.entrypoints=web"
      - "traefik.http.routers.akkok-sicil-neo4j.service=akkok-sicil-neo4j-browser"
      - "traefik.http.routers.akkok-sicil-neo4j.middlewares=neo4j-cors"
      - "traefik.http.services.akkok-sicil-neo4j-browser.loadbalancer.server.port=7474"
      # =========================================================================
      # Neo4j Bolt (WebSocket) - bolt.akkok-sicil.dev.local
      # =========================================================================
      - "traefik.http.routers.akkok-sicil-bolt.rule=Host(`bolt.akkok-sicil.dev.local`)"
      - "traefik.http.routers.akkok-sicil-bolt.entrypoints=web"
      - "traefik.http.routers.akkok-sicil-bolt.service=akkok-sicil-neo4j-bolt"
      - "traefik.http.routers.akkok-sicil-bolt.middlewares=neo4j-cors"
      - "traefik.http.services.akkok-sicil-neo4j-bolt.loadbalancer.server.port=7687"

  # ===========================================================================
  # AKKOK-SİCİL - Redis Cache
  # ===========================================================================
  redis:
    image: redis/redis-stack:latest
    container_name: akkok-sicil-redis
    expose:
      - "6379"
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    volumes:
      - akkok_sicil_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - akkok-sicil-dev-network

  # ===========================================================================
  # AKKOK-SİCİL - PostgreSQL Database
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: akkok-sicil-postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${AKKOK_POSTGRES_PASSWORD}
      - POSTGRES_DB=llm_graph_builder
    command: postgres -c max_connections=2000 -c shared_buffers=256MB
    volumes:
      - akkok_sicil_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - akkok-sicil-dev-network

  # ===========================================================================
  # AKKOK-SİCİL - pgAdmin (PostgreSQL Yönetim Aracı)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: akkok-sicil-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@akkok.com
      - PGADMIN_DEFAULT_PASSWORD=${AKKOK_PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    expose:
      - "80"
    volumes:
      - akkok_sicil_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    restart: always
    networks:
      - akkok-sicil-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.akkok-sicil-pgadmin.rule=Host(`pgadmin.akkok-sicil.dev.local`)"
      - "traefik.http.routers.akkok-sicil-pgadmin.entrypoints=web"
      - "traefik.http.services.akkok-sicil-pgadmin.loadbalancer.server.port=80"

  # ===========================================================================
  # AKKOK-SİCİL - Celery Main Worker
  # ===========================================================================
  celery-main-worker:
    build:
      context: ../celery_worker
      dockerfile: Dockerfile
    container_name: akkok-sicil-celery-main
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=info
      --pool=prefork
      --autoscale=8,2
      -Q celery
      -E
      -n main-worker@%h
    env_file:
      - ../backend/.env.akkok-sicil
    environment:
      - PYTHONPATH=/app
      - ENV=development
      # Volume /app/output'a mount edildiği için OUTPUT_DIR=output olmalı
      # (env_file'daki OUTPUT_DIR=output_celery'yi override eder)
      - OUTPUT_DIR=output
    volumes:
      # Named volume - devcontainer ile paylaşım için
      - akkok_sicil_celery_output:/app/output
      # Celery worker source - bind mount (live reload)
      - /host_mnt/Users/mehmeterdogan/python-projects/llm-graph-builder-yedek/celery_worker/src:/app/src:ro
      - /host_mnt/Users/mehmeterdogan/python-projects/llm-graph-builder-yedek/celery_worker/prompts:/app/prompts:ro
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "2"
    restart: always
    networks:
      - akkok-sicil-dev-network
    depends_on:
      - postgres
      - neo4j
      - redis

  # ===========================================================================
  # AKKOK-SİCİL - Celery DB Writer
  # ===========================================================================
  celery-db-writer:
    build:
      context: ../celery_worker
      dockerfile: Dockerfile
    container_name: akkok-sicil-celery-db
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=info
      --pool=prefork
      --concurrency=2
      -Q db_write
      -E
      -n db-writer@%h
    env_file:
      - ../backend/.env.akkok-sicil
    environment:
      - PYTHONPATH=/app
      - ENV=development
      # Volume /app/output'a mount edildiği için OUTPUT_DIR=output olmalı
      - OUTPUT_DIR=output
    volumes:
      # Named volume - devcontainer ile paylaşım için
      - akkok_sicil_celery_output:/app/output
      # Celery worker source - bind mount (live reload)
      - /host_mnt/Users/mehmeterdogan/python-projects/llm-graph-builder-yedek/celery_worker/src:/app/src:ro
      - /host_mnt/Users/mehmeterdogan/python-projects/llm-graph-builder-yedek/celery_worker/prompts:/app/prompts:ro
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"
    restart: always
    networks:
      - akkok-sicil-dev-network
    depends_on:
      - postgres

  # ===========================================================================
  # AKKOK-SİCİL - Flower (Celery Monitoring)
  # ===========================================================================
  flower:
    image: mher/flower
    container_name: akkok-sicil-flower
    command: celery flower --port=5555
    env_file:
      - ../backend/.env.akkok-sicil
    environment:
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=admin:admin
      - FLOWER_UNAUTHENTICATED_API=true
    expose:
      - "5555"
    restart: always
    networks:
      - akkok-sicil-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.akkok-sicil-flower.rule=Host(`flower.akkok-sicil.dev.local`)"
      - "traefik.http.routers.akkok-sicil-flower.entrypoints=web"
      - "traefik.http.services.akkok-sicil-flower.loadbalancer.server.port=5555"

volumes:
  akkok_sicil_neo4j_data:
    name: akkok_sicil_neo4j_data
  akkok_sicil_neo4j_plugins:
    name: akkok_sicil_neo4j_plugins
  akkok_sicil_neo4j_import:
    name: akkok_sicil_neo4j_import
  akkok_sicil_postgres_data:
    name: akkok_sicil_postgres_data
  akkok_sicil_redis_data:
    name: akkok_sicil_redis_data
  akkok_sicil_pgadmin_data:
    name: akkok_sicil_pgadmin_data
  akkok_sicil_celery_output:
    name: akkok_sicil_celery_output
  akkok_sicil_prompts:
    name: akkok_sicil_prompts

networks:
  akkok-sicil-dev-network:
    external: true
    name: akkok-sicil-dev-network
