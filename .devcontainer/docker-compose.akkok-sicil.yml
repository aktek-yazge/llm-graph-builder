# =============================================================================
# AKKOK-SİCİL - Firma Servisleri
# =============================================================================
# KULLANIM:
#   docker compose -p akkok-sicil -f docker-compose.akkok-sicil.yml up -d
#   docker compose -p akkok-sicil -f docker-compose.akkok-sicil.yml down
#
# ERİŞİM:
#   Neo4j:    http://dev.local/akkok-sicil/neo4j
# =============================================================================

services:
  # ===========================================================================
  # AKKOK-SİCİL - Neo4j Graph Database
  # ===========================================================================
  neo4j:
    image: neo4j:2025.07.1
    container_name: akkok-sicil-neo4j
    restart: always
    expose:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=neo4j/AkkokSicil!654*
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"
    volumes:
      - akkok_sicil_neo4j_data:/data
      - akkok_sicil_neo4j_plugins:/plugins
      - akkok_sicil_neo4j_import:/var/lib/neo4j/import
    networks:
      - akkok-sicil-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.akkok-sicil-neo4j.rule=Host(`dev.local`) && PathPrefix(`/akkok-sicil/neo4j`)"
      - "traefik.http.routers.akkok-sicil-neo4j.entrypoints=web"
      - "traefik.http.routers.akkok-sicil-neo4j.priority=15"
      - "traefik.http.services.akkok-sicil-neo4j.loadbalancer.server.port=7474"
      - "traefik.http.middlewares.strip-akkok-sicil-neo4j.stripprefix.prefixes=/akkok-sicil/neo4j"
      - "traefik.http.routers.akkok-sicil-neo4j.middlewares=strip-akkok-sicil-neo4j"

  # ===========================================================================
  # AKKOK-SİCİL - Redis Cache
  # ===========================================================================
  redis:
    image: redis/redis-stack:latest
    container_name: akkok-sicil-redis
    expose:
      - "6379"
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    volumes:
      - akkok_sicil_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - akkok-sicil-dev-network

  # ===========================================================================
  # AKKOK-SİCİL - PostgreSQL Database
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: akkok-sicil-postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=AkkokSicil!654*
      - POSTGRES_DB=llm_graph_builder
    command: postgres -c max_connections=2000 -c shared_buffers=256MB
    volumes:
      - akkok_sicil_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - akkok-sicil-dev-network

volumes:
  akkok_sicil_neo4j_data:
    name: akkok_sicil_neo4j_data
  akkok_sicil_neo4j_plugins:
    name: akkok_sicil_neo4j_plugins
  akkok_sicil_neo4j_import:
    name: akkok_sicil_neo4j_import
  akkok_sicil_postgres_data:
    name: akkok_sicil_postgres_data
  akkok_sicil_redis_data:
    name: akkok_sicil_redis_data

networks:
  akkok-sicil-dev-network:
    external: true
    name: akkok-sicil-dev-network
