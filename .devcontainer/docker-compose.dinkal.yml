# =============================================================================
# DINKAL - Firma Servisleri
# =============================================================================
# KULLANIM:
#   docker compose -p dinkal -f docker-compose.dinkal.yml up -d
#   docker compose -p dinkal -f docker-compose.dinkal.yml down
#
# ERİŞİM (Subdomain Routing):
#   Neo4j Browser: http://dinkal.dev.local (otomatik Bolt bağlantısı)
#   pgAdmin:       http://dinkal.dev.local/pgadmin
# =============================================================================

services:
  # ===========================================================================
  # DINKAL - Neo4j Graph Database
  # ===========================================================================
  neo4j:
    image: neo4j:2025.07.1
    container_name: dinkal-neo4j
    restart: always
    expose:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=neo4j/Dinkal!654*
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      # Subdomain routing için advertised address ayarları
      # Browser: dinkal.dev.local (HTTP)
      # Bolt: neo4j.dinkal.dev.local:80 (WebSocket)
      - NEO4J_server_default__advertised__address=dinkal.dev.local
      - NEO4J_server_bolt_advertised__address=neo4j.dinkal.dev.local:80
      - NEO4J_server_http_advertised__address=:80
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"
    volumes:
      - dinkal_neo4j_data:/data
      - dinkal_neo4j_plugins:/plugins
      - dinkal_neo4j_import:/var/lib/neo4j/import
    networks:
      - dinkal-dev-network
    labels:
      - "traefik.enable=true"
      # =========================================================================
      # Neo4j Browser (HTTP) - dinkal.dev.local
      # =========================================================================
      - "traefik.http.routers.dinkal-neo4j.rule=Host(`dinkal.dev.local`)"
      - "traefik.http.routers.dinkal-neo4j.entrypoints=web"
      - "traefik.http.routers.dinkal-neo4j.priority=10"
      - "traefik.http.routers.dinkal-neo4j.service=dinkal-neo4j-browser"
      - "traefik.http.services.dinkal-neo4j-browser.loadbalancer.server.port=7474"
      # =========================================================================
      # Neo4j Bolt (WebSocket) - aynı subdomain üzerinden
      # =========================================================================
      - "traefik.http.routers.dinkal-bolt.rule=Host(`neo4j.dinkal.dev.local`)"
      - "traefik.http.routers.dinkal-bolt.entrypoints=web"
      - "traefik.http.routers.dinkal-bolt.service=dinkal-neo4j-bolt"
      - "traefik.http.services.dinkal-neo4j-bolt.loadbalancer.server.port=7687"

  # ===========================================================================
  # DINKAL - Redis Cache
  # ===========================================================================
  redis:
    image: redis/redis-stack:latest
    container_name: dinkal-redis
    expose:
      - "6379"
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    volumes:
      - dinkal_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - dinkal-dev-network

  # ===========================================================================
  # DINKAL - PostgreSQL Database
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dinkal-postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Ekdmjweu483i
      - POSTGRES_DB=llm_graph_builder
    command: postgres -c max_connections=2000 -c shared_buffers=256MB
    volumes:
      - dinkal_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - dinkal-dev-network

  # ===========================================================================
  # DINKAL - PgAdmin
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dinkal-pgadmin
    expose:
      - "80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@dinkal.com
      - PGADMIN_DEFAULT_PASSWORD=Dinkal!654*
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - SCRIPT_NAME=/pgadmin
    volumes:
      - dinkal_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: always
    networks:
      - dinkal-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dinkal-pgadmin.rule=Host(`dinkal.dev.local`) && PathPrefix(`/pgadmin`)"
      - "traefik.http.routers.dinkal-pgadmin.entrypoints=web"
      - "traefik.http.routers.dinkal-pgadmin.priority=20"
      - "traefik.http.services.dinkal-pgadmin.loadbalancer.server.port=80"

volumes:
  dinkal_neo4j_data:
    name: dinkal_neo4j_data
  dinkal_neo4j_plugins:
    name: dinkal_neo4j_plugins
  dinkal_neo4j_import:
    name: dinkal_neo4j_import
  dinkal_postgres_data:
    name: dinkal_postgres_data
  dinkal_pgadmin_data:
    name: dinkal_pgadmin_data
  dinkal_redis_data:
    name: dinkal_redis_data

networks:
  dinkal-dev-network:
    external: true
    name: dinkal-dev-network
