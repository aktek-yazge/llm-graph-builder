# Development environment compose
# Ana docker-compose.yml'e development ayarları ekler
# DevContainer için tek container - hem Python hem Node.js

services:
  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: mcp-inspector
    ports:
      - "6274:6274" # MCP Inspector UI
      - "6277:6277" # MCP Inspector API
    environment:
      - HOST=0.0.0.0
      - PORT=6274
    restart: unless-stopped
    networks:
      - llm-graph-builder_net
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.11.0
    container_name: jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "5778:5778" # Configuration server
      - "9411:9411" # Zipkin compatible endpoint
    restart: unless-stopped
  # Full-stack development container
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000" # Backend API
      - "5173:5173" # Frontend Vite
    volumes:
      - ../:/workspace:cached # Full workspace mount
      - backend_pip_cache:/root/.cache/pip # Python cache
      - frontend_node_modules:/workspace/frontend/node_modules # Node.js cache
      - /var/run/docker.sock:/var/run/docker.sock # Docker socket access
    environment:
      - PYTHONPATH=/workspace/backend
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"] # Manuel başlatma
    depends_on:
      - neo4j
      - qdrant
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "8"
        reservations:
          memory: 8g
    networks:
      - llm-graph-builder_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-service
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "4"
    networks:
      - llm-graph-builder_net

  neo4j:
    image: neo4j:2025.07.1
    container_name: neo4j-service
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/qwerty5555
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "4"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
      - neo4j_import:/var/lib/neo4j/import
    networks:
      - llm-graph-builder_net

  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      # Disable consumer timeout for long-running tasks (default is 30min = 1800000ms)
      # Use 'infinity' to completely disable, or high value like 7200000 (2 hours)
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit consumer_timeout infinity
    restart: unless-stopped
    networks:
      - llm-graph-builder_net

  # PostgreSQL - Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=f456Re?lm1!
      - POSTGRES_DB=llm_graph_builder
    # Increase max_connections for high concurrency workloads
    command: postgres -c max_connections=2000 -c shared_buffers=256MB
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - llm-graph-builder_net

volumes:
  frontend_node_modules:
    external: true
    name: llm-graph-builder_frontend_node_modules
  backend_pip_cache:
    external: true
    name: llm-graph-builder_backend_pip_cache
  qdrant_storage:
    external: true
    name: llm-graph-builder_qdrant_storage
  neo4j_data:
    external: true
    name: llm-graph-builder_neo4j_data
  neo4j_plugins:
    external: true
    name: llm-graph-builder_neo4j_plugins
  neo4j_import:
    external: true
    name: llm-graph-builder_neo4j_import
  postgres_data_dev:
    external: true
    name: llm-graph-builder_postgres_data_dev


# Development network - ana compose ile uyumlu
networks:
  llm-graph-builder_net:
    external: true
    name: workspace_llm-graph-builder_net
