# =============================================================================
# DEVELOPMENT ENVIRONMENT COMPOSE - Traefik Entegrasyonu
# =============================================================================
# DevContainer için full-stack development ortamı
# Traefik ile reverse proxy ve multi-tenant desteği
#
# WAT Projesi Erişim (Traefik):
#   Frontend:     http://dev.local/wat/ui
#   Backend:      http://dev.local/wat/server
#   MCP:          http://dev.local/wat/mcp
#   Neo4j:        http://dev.local/wat/neo4j
#   Qdrant:       http://dev.local/wat/qdrant
#   Redis:        http://localhost:8001 (RedisInsight)
#
# Altyapı Servisleri:
#   RabbitMQ:     http://dev.local/rabbitmq
#   Traefik:      http://localhost:8090/dashboard/
#
# Lokal test için /etc/hosts:
#   127.0.0.1   dev.local
#
# Alternatif direkt erişim (Traefik olmadan):
#   Backend:   http://localhost:8000
#   Frontend:  http://localhost:5173
#   Neo4j:     http://localhost:7474
# =============================================================================

services:
  # ===========================================================================
  # TRAEFIK - Reverse Proxy & Load Balancer
  # ===========================================================================
  traefik:
    image: traefik:v3.0
    container_name: traefik-dev
    restart: always
    command:
      # API ve Dashboard
      - "--api.insecure=true"
      - "--api.dashboard=true"
      # Docker provider - container label'larını dinle
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=wat-dev-network"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Logging
      - "--log.level=DEBUG"
      - "--accesslog=true"
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "8090:8080"   # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - wat-dev-network
      - dinkal-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`dev.local`) && PathPrefix(`/traefik`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ===========================================================================
  # MCP INSPECTOR & JAEGER
  # ===========================================================================
  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: mcp-inspector
    ports:
      - "6274:6274" # MCP Inspector UI
      - "6277:6277" # MCP Inspector API
    environment:
      - HOST=0.0.0.0
      - PORT=6274
    restart: unless-stopped
    networks:
      - wat-dev-network
      - dinkal-dev-network

  # ===========================================================================
  # DEVCONTAINER - Full-stack Development Container
  # ===========================================================================
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devcontainer
    ports:
      - "8000:8000" # Backend API (direct access)
      - "5173:5173" # Frontend Vite (direct access)
    volumes:
      - ../:/workspace:cached # Full workspace mount
      - backend_pip_cache:/root/.cache/pip # Python cache
      - frontend_node_modules:/workspace/frontend/node_modules # Node.js cache
      - /var/run/docker.sock:/var/run/docker.sock # Docker socket access
    environment:
      - PYTHONPATH=/workspace/backend
      # Neo4j bağlantısı
      - NEO4J_URI=bolt://neo4j-wat:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=Watmotor!654*
      - NEO4J_DATABASE=neo4j
      # PostgreSQL bağlantısı
      - QUEUE_DB_URL=postgresql://postgres:Ekdmjweu483i@postgres-wat:5432/llm_graph_builder
      # Celery/RabbitMQ
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq-dev:5672//
      - CELERY_RESULT_BACKEND=db+postgresql://postgres:Ekdmjweu483i@postgres-wat:5432/llm_graph_builder
      # MCP Server
      - MCP_HTTP_HOST=mcp-neo4j-cypher-wat
      - MCP_HTTP_PORT=8002
      # Redis Cache
      - REDIS_URL=redis://redis-wat:6379
      - REDIS_SEMANTIC_URL=redis://redis-wat:6379
      - REDIS_CACHE_ENABLED=true
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=llm-graph-builder-backend
      - OTEL_ENVIRONMENT=development
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"] # Manuel başlatma
    depends_on:
      - neo4j
      - qdrant
      - postgres
      - rabbitmq
      - redis
      - traefik
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "8"
        reservations:
          memory: 8g
    networks:
      - wat-dev-network
      - dinkal-dev-network
    labels:
      - "traefik.enable=true"
      # Backend API routing - /wat/server prefix
      - "traefik.http.routers.wat-backend.rule=Host(`dev.local`) && PathPrefix(`/wat/server`)"
      - "traefik.http.routers.wat-backend.entrypoints=web"
      - "traefik.http.routers.wat-backend.priority=20"
      - "traefik.http.services.wat-backend.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.strip-wat-server.stripprefix.prefixes=/wat/server"
      - "traefik.http.routers.wat-backend.middlewares=strip-wat-server"
      # Frontend routing - /wat/ui path
      - "traefik.http.routers.wat-frontend.rule=Host(`dev.local`) && PathPrefix(`/wat/ui`)"
      - "traefik.http.routers.wat-frontend.entrypoints=web"
      - "traefik.http.routers.wat-frontend.priority=15"
      - "traefik.http.services.wat-frontend.loadbalancer.server.port=5173"
      - "traefik.http.middlewares.strip-wat-ui.stripprefix.prefixes=/wat/ui"
      - "traefik.http.routers.wat-frontend.middlewares=strip-wat-ui"

  # ===========================================================================
  # QDRANT - Vector Database
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-wat
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "4"
    networks:
      - wat-dev-network
      - dinkal-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wat-qdrant.rule=Host(`dev.local`) && PathPrefix(`/wat/qdrant`)"
      - "traefik.http.routers.wat-qdrant.entrypoints=web"
      - "traefik.http.services.wat-qdrant.loadbalancer.server.port=6333"
      - "traefik.http.middlewares.strip-wat-qdrant.stripprefix.prefixes=/wat/qdrant"
      - "traefik.http.routers.wat-qdrant.middlewares=strip-wat-qdrant"

  # ===========================================================================
  # NEO4J - WAT Graph Database
  # ===========================================================================
  neo4j:
    image: neo4j:2025.07.1
    container_name: neo4j-wat
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/Watmotor!654*
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
      - neo4j_import:/var/lib/neo4j/import
    networks:
      - wat-dev-network
      - dinkal-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wat-neo4j.rule=Host(`dev.local`) && PathPrefix(`/wat/neo4j`)"
      - "traefik.http.routers.wat-neo4j.entrypoints=web"
      - "traefik.http.routers.wat-neo4j.priority=15"
      - "traefik.http.services.wat-neo4j.loadbalancer.server.port=7474"
      - "traefik.http.middlewares.strip-wat-neo4j.stripprefix.prefixes=/wat/neo4j"
      - "traefik.http.routers.wat-neo4j.middlewares=strip-wat-neo4j"

  # ===========================================================================
  # MCP NEO4J CYPHER - MCP Server for Neo4j
  # ===========================================================================
  mcp-neo4j-cypher:
    build:
      context: ../mcp-servers/mcp-neo4j-cypher
      dockerfile: Dockerfile
    container_name: mcp-neo4j-cypher-wat
    restart: always
    ports:
      - "8002:8002"
    environment:
      - NEO4J_URI=bolt://neo4j-wat:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=Watmotor!654*
      - NEO4J_DATABASE=neo4j
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8002
      - NEO4J_TRANSPORT=http
      - NEO4J_MCP_SERVER_HOST=0.0.0.0
      - NEO4J_MCP_SERVER_PORT=8002
      - NEO4J_MCP_SERVER_PATH=/mcp/
      - NEO4J_NAMESPACE=
      - NEO4J_MCP_SERVER_ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal,mcp-neo4j-cypher-wat,mcp-neo4j-cypher,devcontainer
      - NEO4J_MCP_SERVER_ALLOW_ORIGINS=*
      - NEO4J_READ_TIMEOUT=30
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../mcp-servers/mcp-neo4j-cypher/src:/app/src
    depends_on:
      - neo4j
    networks:
      - wat-dev-network
      - dinkal-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wat-mcp.rule=Host(`dev.local`) && PathPrefix(`/wat/mcp`)"
      - "traefik.http.routers.wat-mcp.entrypoints=web"
      - "traefik.http.routers.wat-mcp.priority=20"
      - "traefik.http.services.wat-mcp.loadbalancer.server.port=8002"
      - "traefik.http.middlewares.strip-wat-mcp.stripprefix.prefixes=/wat/mcp"
      - "traefik.http.routers.wat-mcp.middlewares=strip-wat-mcp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8002/mcp/ -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H 'mcp-session-id: healthcheck' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}' | grep -q '\"result\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # RABBITMQ - Message Broker
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit consumer_timeout infinity
    restart: unless-stopped
    networks:
      - wat-dev-network
      - dinkal-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`dev.local`) && PathPrefix(`/rabbitmq`)"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
      - "traefik.http.middlewares.strip-rabbitmq.stripprefix.prefixes=/rabbitmq"
      - "traefik.http.routers.rabbitmq.middlewares=strip-rabbitmq"

  # ===========================================================================
  # REDIS STACK - Semantic Cache (RediSearch)
  # ===========================================================================
  redis:
    image: redis/redis-stack:latest
    container_name: redis-wat
    ports:
      - "6379:6379"   # Redis
      - "6381:6379"   # Alternative port for semantic cache
      - "8001:8001"   # RedisInsight
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - wat-dev-network
      - dinkal-dev-network

  # ===========================================================================
  # POSTGRESQL with pgvector - Database
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-wat
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Ekdmjweu483i
      - POSTGRES_DB=llm_graph_builder
    command: postgres -c max_connections=2000 -c shared_buffers=256MB
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - wat-dev-network
      - dinkal-dev-network


  # ===========================================================================
  # POSTGRESQL - DINKAL Database
  # ===========================================================================
  postgres-dinkal:
    image: pgvector/pgvector:pg16
    container_name: postgres-dinkal
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Ekdmjweu483i
      - POSTGRES_DB=llm_graph_builder
    command: postgres -c max_connections=2000 -c shared_buffers=256MB
    volumes:
      - dinkal_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - dinkal-dev-network

  # ===========================================================================
  # PGADMIN - DINKAL PostgreSQL Web UI
  # ===========================================================================
  pgadmin-dinkal:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-dinkal
    expose:
      - "80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@dinkal.com
      - PGADMIN_DEFAULT_PASSWORD=Dinkal!654*
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - SCRIPT_NAME=/dinkal/pgadmin
    volumes:
      - ./pgadmin-dinkal/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin-dinkal/pgpass:/pgadmin4/pgpass:ro
      - dinkal_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres-dinkal
    restart: always
    networks:
      - dinkal-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dinkal-pgadmin.rule=Host(`dev.local`) && PathPrefix(`/dinkal/pgadmin`)"
      - "traefik.http.routers.dinkal-pgadmin.entrypoints=web"
      - "traefik.http.routers.dinkal-pgadmin.priority=20"
      - "traefik.http.services.dinkal-pgadmin.loadbalancer.server.port=80"
      - "traefik.http.routers.dinkal-pgadmin.middlewares="

  # ===========================================================================
  # NEO4J - DINKAL Graph Database
  # ===========================================================================
  neo4j-dinkal:
    image: neo4j:2025.07.1
    container_name: neo4j-dinkal
    restart: always
    expose:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=neo4j/Dinkal!654*
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"
    volumes:
      - dinkal_neo4j_data:/data
      - dinkal_neo4j_plugins:/plugins
      - dinkal_neo4j_import:/var/lib/neo4j/import
    networks:
      - dinkal-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dinkal-neo4j.rule=Host(`dev.local`) && PathPrefix(`/dinkal/neo4j`)"
      - "traefik.http.routers.dinkal-neo4j.entrypoints=web"
      - "traefik.http.routers.dinkal-neo4j.priority=15"
      - "traefik.http.services.dinkal-neo4j.loadbalancer.server.port=7474"
      - "traefik.http.middlewares.strip-dinkal-neo4j.stripprefix.prefixes=/dinkal/neo4j"
      - "traefik.http.routers.dinkal-neo4j.middlewares=strip-dinkal-neo4j"

  # ===========================================================================
  # REDIS - DINKAL Cache
  # ===========================================================================
  redis-dinkal:
    image: redis/redis-stack:latest
    container_name: redis-dinkal
    expose:
      - "6379"
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    volumes:
      - dinkal_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - dinkal-dev-network

volumes:
  # WAT Volumes
  frontend_node_modules:
    external: true
    name: wat_frontend_node_modules
  backend_pip_cache:
    external: true
    name: wat_backend_pip_cache
  qdrant_storage:
    external: true
    name: wat_qdrant_storage
  neo4j_data:
    external: true
    name: wat_neo4j_data
  neo4j_plugins:
    external: true
    name: wat_neo4j_plugins
  neo4j_import:
    external: true
    name: wat_neo4j_import
  postgres_data_dev:
    external: true
    name: wat_postgres_data
  redis_data:
    name: wat_redis_data
  # DINKAL Volumes
  dinkal_postgres_data:
    name: dinkal_postgres_data
  dinkal_pgadmin_data:
    name: dinkal_pgadmin_data
  dinkal_neo4j_data:
    name: dinkal_neo4j_data
  dinkal_neo4j_plugins:
    name: dinkal_neo4j_plugins
  dinkal_neo4j_import:
    name: dinkal_neo4j_import
  dinkal_redis_data:
    name: dinkal_redis_data

networks:
  wat-dev-network:
    driver: bridge
    name: wat-dev-network
  dinkal-dev-network:
    driver: bridge
    name: dinkal-dev-network
