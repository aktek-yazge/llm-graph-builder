# =============================================================================
# DEVCONTAINER - Full-stack Development Container
# =============================================================================
# VS Code DevContainer için development ortamı
#
# KULLANIM:
#   Bu dosya VS Code DevContainer tarafından otomatik kullanılır.
#
# BACKEND/FRONTEND BAŞLATMA:
#   cd /workspace/backend && ./start-backend-yedek.sh akkok-sicil
#   cd /workspace/frontend && yarn dev
#
# ERİŞİM (Traefik routing - tümü aynı devcontainer:8000/5173'e gider):
#   WAT:         dev.local/wat/server         dev.local/wat/ui
#   AKKOK-SİCİL: dev.local/akkok-sicil/server dev.local/akkok-sicil/ui
#   DINKAL:      dev.local/dinkal/server      dev.local/dinkal/ui
#
# NOT: Aynı anda sadece bir müşteri çalıştırılabilir (aynı port kullanılıyor)
#
# MEVCUT COMPOSE DOSYALARI:
#   docker-compose.shared.yml      → Traefik, RabbitMQ, MCP Inspector, MCP Neo4j
#   docker-compose.wat.yml         → WAT firma servisleri (Neo4j, PostgreSQL, Redis)
#   docker-compose.dinkal.yml      → DINKAL firma servisleri
#   docker-compose.akkok-sicil.yml → AKKOK-SİCİL firma servisleri
#   docker-compose.dev.yml         → DevContainer (bu dosya)
# =============================================================================

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devcontainer
    # Portlar Traefik üzerinden routing yapılıyor, host'a açmaya gerek yok
    # Direct access gerekirse: docker exec -it devcontainer bash
    expose:
      - "8000"
      - "5173"
    volumes:
      - ../:/workspace:cached # Full workspace mount
      - backend_pip_cache:/root/.cache/pip # Python cache
      - frontend_node_modules:/workspace/frontend/node_modules # Node.js cache
      - /var/run/docker.sock:/var/run/docker.sock # Docker socket access
      - akkok_sicil_celery_output:/workspace/backend/output_celery # Celery output paylaşımı
      - atuin_data:/root/.local/share/atuin # Atuin shell history
    environment:
      - PYTHONPATH=/workspace/backend
      # Neo4j bağlantısı (servis adı kullanılır, backend .env'den override edilir)

    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"] # Manuel başlatma
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "8"
        reservations:
          memory: 8g
    networks:
      - wat-dev-network
      - dinkal-dev-network
      - akkok-sicil-dev-network
    # NOT: Traefik routing kuralları traefik-dynamic.yml dosyasında tanımlı
    # File provider kullanıldığı için Docker labels'a gerek yok

volumes:
  frontend_node_modules:
    external: true
    name: wat_frontend_node_modules
  backend_pip_cache:
    external: true
    name: wat_backend_pip_cache
  akkok_sicil_celery_output:
    external: true
    name: akkok_sicil_celery_output
  atuin_data:
    name: devcontainer_atuin_data

networks:
  wat-dev-network:
    external: true
    name: wat-dev-network
  dinkal-dev-network:
    external: true
    name: dinkal-dev-network
  akkok-sicil-dev-network:
    external: true
    name: akkok-sicil-dev-network
