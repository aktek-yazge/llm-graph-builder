# =============================================================================
# Traefik Dynamic Configuration - Devcontainer Routing
# =============================================================================
# DevContainer için routing tanımları
# Subdomain-based routing kullanılıyor
# =============================================================================

http:
  routers:
    # =========================================================================
    # AKKOK-SİCİL - Subdomain Routing
    # =========================================================================
    akkok-sicil-backend:
      rule: 'Host(`server.akkok-sicil.dev.local`)'
      entryPoints:
        - web
      service: devcontainer-backend

    akkok-sicil-frontend:
      rule: 'Host(`akkok-sicil.dev.local`)'
      entryPoints:
        - web
      service: devcontainer-frontend

    # =========================================================================
    # WAT - Subdomain Routing
    # =========================================================================
    wat-backend:
      rule: 'Host(`server.wat.dev.local`)'
      entryPoints:
        - web
      service: devcontainer-backend

    wat-frontend:
      rule: 'Host(`wat.dev.local`)'
      entryPoints:
        - web
      service: devcontainer-frontend

    # =========================================================================
    # DINKAL - Subdomain Routing
    # =========================================================================
    dinkal-backend:
      rule: 'Host(`server.dinkal.dev.local`)'
      entryPoints:
        - web
      service: devcontainer-backend

    dinkal-frontend:
      rule: 'Host(`dinkal.dev.local`)'
      entryPoints:
        - web
      service: devcontainer-frontend

  services:
    devcontainer-backend:
      loadBalancer:
        servers:
          - url: 'http://devcontainer:8000'

    devcontainer-frontend:
      loadBalancer:
        servers:
          - url: 'http://devcontainer:5173'

# =============================================================================
# NOT: Aşağıdaki servisler Docker labels ile yönetilir (docker-compose.shared.yml)
# =============================================================================
# MCP Gateway: mcp-gateway.dev.local -> mcp-gateway:4444
#   - Admin UI: http://mcp-gateway.dev.local/admin
#   - Health: http://mcp-gateway.dev.local/health
#   - MCP Endpoint: http://mcp-gateway.dev.local/mcp
#
# MCP Inspector: mcp-inspector.dev.local -> mcp-inspector:6274
# MCP Neo4j Cypher: mcp.dev.local -> mcp-neo4j-cypher:8002
# RabbitMQ: rabbitmq.dev.local -> rabbitmq:15672
# Traefik Dashboard: traefik.dev.local -> traefik:8080
