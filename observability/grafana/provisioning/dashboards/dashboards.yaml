# =============================================================================
# Grafana Dashboards Provisioning
# =============================================================================
# Dashboard JSON dosyalarını otomatik yükler.
# =============================================================================

apiVersion: 1

providers:
  - name: 'LLM Graph Builder Dashboards'
    orgId: 1
    folder: 'LLM Graph Builder'
    folderUid: 'llm-graph-builder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

