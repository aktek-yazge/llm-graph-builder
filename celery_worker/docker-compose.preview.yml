# Docker Compose for Celery Workers - PREVIEW Environment
# 
# Bu dosya PREVIEW ortamı için - Docker network içindeki RabbitMQ ve PostgreSQL'e bağlanır
# .preview.env dosyasını kullanır (container hostname'leri: rabbitmq-dev, postgres-dev)
#
# Usage:
#   docker-compose -f docker-compose.preview.yml --env-file .preview.env up -d
#   docker-compose -f docker-compose.preview.yml logs -f main_worker
#   docker-compose -f docker-compose.preview.yml down
#
# Kısa yol: ./start-docker-preview.sh

services:
  # ============================================
  # BASE IMAGE BUILDER (only builds, doesn't run)
  # ============================================
  celery_base:
    build:
      context: .
      dockerfile: Dockerfile
    image: celery-worker:latest
    profiles:
      - build-only  # Never runs, only builds image

  # ============================================
  # MAIN WORKER - Chunking, Graph, Embeddings
  # ============================================
  main_worker:
    image: celery-worker:latest
    container_name: celery-main-worker
    # prefork: Docker/Linux için - Flower'dan Grow/Shrink destekler
    # concurrency: Başlangıç worker sayısı (Flower'dan artırılabilir/azaltılabilir)
    # Flower UI: Workers > Worker Name > Pool > Grow/Shrink butonları
    # NOT: autoscale KULLANMA - Flower'dan yapılan değişiklikler kalıcı olsun
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=prefork
      --concurrency=12
      -Q celery
      -E
      -n main-worker@%h
    env_file:
      - .preview.env
    environment:
      - PYTHONPATH=/app
      - ENV=${ENV:-preview}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    volumes:
      - ${OUTPUT_VOLUME:-output_data}:/app/output
      - ./src:/app/src  # DEV: Kod değişiklikleri için (restart gerekir)
    deploy:
      resources:
        limits:
          memory: 24g
          cpus: "6"
        reservations:
          memory: 8g
          cpus: "2"
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - preview
      - memgraph  # Memgraph bağlantısı için
    restart: always

  # ============================================
  # DB WRITER - PostgreSQL Writes
  # ============================================
  db_writer:
    image: celery-worker:latest
    container_name: celery-db-writer
    # prefork: Docker/Linux için - Flower'dan Grow/Shrink destekler
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=prefork
      --concurrency=${WRITER_CONCURRENCY:-4}
      -Q db_write
      -E
      -n db-writer@%h
    env_file:
      - .preview.env
    environment:
      - PYTHONPATH=/app
      - ENV=${ENV:-preview}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./src:/app/src  # DEV: Kod değişiklikleri için (restart gerekir)
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4"
        reservations:
          memory: 1g
          cpus: "1"
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - preview
      - memgraph  # Memgraph bağlantısı için
    restart: always

  # ============================================
  # NEO4J WRITER - Neo4j Writes
  # ============================================
  # ⚠️ DISABLED: Şu an kullanılmıyor - main_worker doğrudan Neo4j'ye yazıyor
  # Gelecekte queue-based yazma istenirse comment'leri kaldırın
  # neo4j_writer:
  #   image: celery-worker:latest
  #   container_name: celery-neo4j-writer
  #   # prefork: Flower'dan Grow/Shrink destekler (Linux/Docker için)
  #   command: >
  #     python -m celery -A src.celery_app worker
  #     --loglevel=${LOG_LEVEL:-info}
  #     --pool=${CELERY_POOL:-prefork}
  #     --concurrency=${WRITER_CONCURRENCY:-2}
  #     -Q neo4j_write
  #     -E
  #     -n neo4j-writer@%h
  #   env_file:
  #     - .preview.env
  #   environment:
  #     - PYTHONPATH=/app
  #     - ENV=${ENV:-preview}
  #     - LANG=C.UTF-8
  #     - LC_ALL=C.UTF-8
  #     - PYTHONIOENCODING=utf-8
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 4g
  #         cpus: "2"
  #       reservations:
  #         memory: 1g
  #         cpus: "0.5"
  #   healthcheck:
  #     test: ["CMD", "python", "-m", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "50m"
  #       max-file: "3"
  #   networks:
  #     - preview
  #   restart: unless-stopped

  # ============================================
  # FLOWER - Monitoring Dashboard
  # ============================================
  flower:
    image: mher/flower
    container_name: celery-flower
    command: celery flower --port=5555
    env_file:
      - .preview.env
    environment:
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_AUTH:-admin:admin}
      - FLOWER_UNAUTHENTICATED_API=true
    ports:
      - "5556:5555"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - preview
      - memgraph  # Memgraph bağlantısı için
    restart: always

# Preview ortamı network'ü (root docker-compose.preview.yml'de tanımlı)
# Docker Compose network adını project_name + network_name olarak oluşturur
networks:
  preview:
    external: true
    name: llm-graph-builder_preview
  # Memgraph network - GRAPH_DB_TYPE=memgraph kullanıldığında gerekli
  memgraph:
    external: true
    name: memgraph-platform_default

volumes:
  output_data:

