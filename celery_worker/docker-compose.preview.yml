# =============================================================================
# CELERY WORKER - Preview Stack (Multi-tenant Template)
# =============================================================================
#
# Kullanım:
#   docker compose -p {firma} -f docker-compose.preview.yml up -d
#
# Örnek:
#   docker compose -p dinkal -f docker-compose.preview.yml up -d
#
# Erişim:
#   Flower: https://{firma}.yazge.aktekbilisim.com/flower
#
# NOT: Bu compose backend/docker-compose.preview.yml ile birlikte kullanılabilir
#      veya backend compose'undaki celery servisleri kullanılabilir.
#      Bu dosya sadece celery worker'ları ayrı yönetmek istenirse kullanılır.
#
# Gerekli .env değişkenleri:
#   - TENANT_DOMAIN
#   - POSTGRES_URL, CELERY_BROKER_URL, CELERY_RESULT_BACKEND
#   - NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD, NEO4J_DATABASE
#   - REDIS_URL
#   - OPENAI_API_KEY
#
# =============================================================================

services:
  # ============================================
  # BASE IMAGE BUILDER (only builds, doesn't run)
  # ============================================
  celery_base:
    build:
      context: .
      dockerfile: Dockerfile
    image: celery-worker:latest
    profiles:
      - build-only

  # ============================================
  # MAIN WORKER - Chunking, Graph, Embeddings
  # ============================================
  main_worker:
    image: celery-worker:latest
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=prefork
      --autoscale=16,4
      -Q celery
      -E
      -n main-worker@%h
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENV=preview
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      # Database/Broker bağlantıları .env'den gelir
      - POSTGRES_URL=${POSTGRES_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE}
      - REDIS_URL=${REDIS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
    volumes:
      - celery_output:/app/output
      - ./src:/app/src
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "8"
        reservations:
          memory: 4g
          cpus: "2"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "celery",
          "-A",
          "src.celery_app",
          "inspect",
          "ping",
          "-d",
          "celery@$$HOSTNAME",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - internal
      - observability
    restart: always

  # ============================================
  # DB WRITER - PostgreSQL Writes
  # ============================================
  db_writer:
    image: celery-worker:latest
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=prefork
      --concurrency=${WRITER_CONCURRENCY:-2}
      -Q db_write
      -E
      -n db-writer@%h
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENV=preview
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - POSTGRES_URL=${POSTGRES_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE}
    volumes:
      - ./src:/app/src
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"
        reservations:
          memory: 1g
          cpus: "0.5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "celery",
          "-A",
          "src.celery_app",
          "inspect",
          "ping",
          "-d",
          "celery@$$HOSTNAME",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - internal
      - observability
    restart: always

  # ============================================
  # FLOWER - Monitoring Dashboard
  # ============================================
  flower:
    image: mher/flower
    command: celery flower --port=5555
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_AUTH:-admin:admin}
      - FLOWER_UNAUTHENTICATED_API=true
    expose:
      - "5555"
    labels:
      - "logging=alloy"
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-flower.rule=Host(`${TENANT_DOMAIN}`) && PathPrefix(`/flower`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-flower.entrypoints=web,websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-flower.priority=20"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-flower.loadbalancer.server.port=5555"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-strip-flower.stripprefix.prefixes=/flower"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-flower.middlewares=${COMPOSE_PROJECT_NAME}-strip-flower"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - internal
      - observability
      - traefik-public
    restart: always

networks:
  internal:
    external: true
    name: ${COMPOSE_PROJECT_NAME}_internal
  observability:
    external: true
    name: observability
  traefik-public:
    external: true
    name: traefik-public

volumes:
  celery_output:
