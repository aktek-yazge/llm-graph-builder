# Docker Compose for Celery Workers
# 
# Architecture:
#   - Main Worker: Handles chunking, graph creation, embeddings (CPU/GPU intensive)
#   - DB Writer: Dedicated worker for PostgreSQL writes (single connection, batch commits)
#   - Neo4j Writer: Dedicated worker for Neo4j writes (single connection, batch writes)
#   - Flower: Monitoring dashboard
#
# External Dependencies (set in .env):
#   - RabbitMQ: CELERY_BROKER_URL
#   - PostgreSQL: QUEUE_DB_URL, CELERY_RESULT_BACKEND
#   - Neo4j: NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD
#
# Usage:
#   docker-compose up -d                        # Start all services
#   docker-compose up -d --scale main_worker=3  # Scale main workers
#   docker-compose logs -f main_worker          # View logs
#   docker-compose build                        # Rebuild image

services:
  # ============================================
  # BASE IMAGE BUILDER (only builds, doesn't run)
  # ============================================
  celery_base:
    build:
      context: .
      dockerfile: Dockerfile
    image: celery-worker:latest
    profiles:
      - build-only  # Never runs, only builds image

  # ============================================
  # MAIN WORKER - Chunking, Graph, Embeddings
  # ============================================
  main_worker:
    image: celery-worker:latest
    container_name: celery-main-worker
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=${CELERY_POOL:-threads}
      --concurrency=${MAIN_CONCURRENCY:-8}
      -Q celery
      -E
      -n main-worker@%h
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENV=${ENV:-production}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    volumes:
      - ${OUTPUT_VOLUME:-output_data}:/app/output
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4"
        reservations:
          memory: 2g
          cpus: "1"
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - celery-network
    restart: unless-stopped

  # ============================================
  # DB WRITER - PostgreSQL Writes
  # ============================================
  db_writer:
    image: celery-worker:latest
    container_name: celery-db-writer
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=${CELERY_POOL:-threads}
      --concurrency=${WRITER_CONCURRENCY:-2}
      -Q db_write
      -E
      -n db-writer@%h
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENV=${ENV:-production}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
        reservations:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - celery-network
    restart: unless-stopped

  # ============================================
  # NEO4J WRITER - Neo4j Writes
  # ============================================
  neo4j_writer:
    image: celery-worker:latest
    container_name: celery-neo4j-writer
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=${CELERY_POOL:-threads}
      --concurrency=${WRITER_CONCURRENCY:-2}
      -Q neo4j_write
      -E
      -n neo4j-writer@%h
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENV=${ENV:-production}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"
        reservations:
          memory: 1g
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - celery-network
    restart: unless-stopped

  # ============================================
  # FLOWER - Monitoring Dashboard
  # ============================================
  flower:
    image: mher/flower:2.0
    container_name: celery-flower
    command: >
      celery flower
      --broker=${CELERY_BROKER_URL}
      --port=5555
    env_file:
      - .env
    environment:
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_AUTH:-admin:admin}
      - FLOWER_UNAUTHENTICATED_API=true
    ports:
      - "5555:5555"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks:
      - celery-network
    restart: unless-stopped

networks:
  celery-network:
    driver: bridge

volumes:
  output_data:
