# Docker Compose for Celery Workers - LOCAL/DEV Environment
# 
# Bu dosya DEV ortamı için - Docker network içindeki RabbitMQ ve PostgreSQL'e bağlanır
# .env dosyasını kullanır (rabbitmq-dev, postgres-dev hostnames)
#
# Usage:
#   docker-compose up -d                        # Start all services
#   docker-compose up -d --scale main_worker=3  # Scale main workers
#   docker-compose logs -f main_worker          # View logs
#   docker-compose build celery_base            # Rebuild image

services:
  # ============================================
  # BASE IMAGE BUILDER (only builds, doesn't run)
  # ============================================
  celery_base:
    build:
      context: .
      dockerfile: Dockerfile
    image: celery-worker:latest
    profiles:
      - build-only  # Never runs, only builds image

  # ============================================
  # MAIN WORKER - Chunking, Graph, Embeddings
  # ============================================
  main_worker:
    image: celery-worker:latest
    container_name: celery-main-worker-dev
    # prefork: Docker/Linux için - Flower'dan Grow/Shrink destekler
    # autoscale: min 8, max 64 process
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=prefork
      --autoscale=16,4
      -Q celery
      -E
      -n main-worker@%h
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENV=${ENV:-development}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    volumes:
      - ${OUTPUT_VOLUME:-output_data}:/app/output
      - ./src:/app/src  # DEV: Kod değişiklikleri için (restart gerekir)
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "4"
        reservations:
          memory: 6g
          cpus: "1"
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - dev
    restart: unless-stopped

  # ============================================
  # DB WRITER - PostgreSQL Writes
  # ============================================
  db_writer:
    image: celery-worker:latest
    container_name: celery-db-writer-dev
    # prefork: Docker/Linux için - Flower'dan Grow/Shrink destekler
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=prefork
      --concurrency=${WRITER_CONCURRENCY:-2}
      -Q db_write
      -E
      -n db-writer@%h
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENV=${ENV:-development}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./src:/app/src  # DEV: Kod değişiklikleri için (restart gerekir)
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
        reservations:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - dev
    restart: unless-stopped

  # ============================================
  # NEO4J WRITER - Neo4j Writes
  # ============================================
  # ⚠️ DISABLED: main_worker doğrudan Neo4j'ye yazıyor
  # Gelecekte queue-based yazma istenirse comment'leri kaldırın
  # neo4j_writer:
  #   image: celery-worker:latest
  #   container_name: celery-neo4j-writer-dev
  #   # prefork: Docker/Linux için
  #   command: >
  #     python -m celery -A src.celery_app worker
  #     --loglevel=${LOG_LEVEL:-info}
  #     --pool=prefork
  #     --concurrency=${WRITER_CONCURRENCY:-2}
  #     -Q neo4j_write
  #     -E
  #     -n neo4j-writer@%h
  #   env_file:
  #     - .env
  #   environment:
  #     - PYTHONPATH=/app
  #     - ENV=${ENV:-development}
  #     - LANG=C.UTF-8
  #     - LC_ALL=C.UTF-8
  #     - PYTHONIOENCODING=utf-8
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 4g
  #         cpus: "2"
  #       reservations:
  #         memory: 1g
  #         cpus: "0.5"
  #   healthcheck:
  #     test: ["CMD", "python", "-m", "celery", "-A", "src.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "50m"
  #       max-file: "3"
  #   networks:
  #     - dev
  #   restart: unless-stopped

  # ============================================
  # FLOWER - Monitoring Dashboard
  # ============================================
  flower:
    image: mher/flower
    container_name: celery-flower-dev
    command: celery flower --port=5555
    env_file:
      - .env
    environment:
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_AUTH:-admin:admin}
      - FLOWER_UNAUTHENTICATED_API=true
    ports:
      - "5555:5555"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - dev
    restart: unless-stopped

# Dev ortamı network'ü (rabbitmq-dev, postgres-dev ile aynı)
networks:
  dev:
    external: true
    name: workspace_llm-graph-builder_net

volumes:
  output_data:
