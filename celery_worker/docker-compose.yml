# =============================================================================
# CELERY WORKER - Dev Stack (Multi-tenant Template)
# =============================================================================
#
# Kullanım:
#   docker compose -p {firma} -f docker-compose.yml up -d
#
# Örnek:
#   docker compose -p akkok-sicil -f docker-compose.yml up -d
#
# Erişim:
#   Flower: http://dev.local/{firma}/flower
#
# NOT: Dev ortamında .devcontainer/docker-compose.{firma}.yml kullanılabilir
#      Bu dosya celery worker'ları ayrı yönetmek için.
#
# Gerekli .env değişkenleri:
#   - POSTGRES_URL, CELERY_BROKER_URL, CELERY_RESULT_BACKEND
#   - NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD, NEO4J_DATABASE
#   - REDIS_URL
#
# =============================================================================

services:
  # ============================================
  # BASE IMAGE BUILDER (only builds, doesn't run)
  # ============================================
  celery_base:
    build:
      context: .
      dockerfile: Dockerfile
    image: celery-worker:latest
    profiles:
      - build-only

  # ============================================
  # MAIN WORKER - Chunking, Graph, Embeddings
  # ============================================
  main_worker:
    image: celery-worker:latest
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=prefork
      --autoscale=8,2
      -Q celery
      -E
      -n main-worker@%h
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENV=${ENV:-development}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    volumes:
      - celery_output:/app/output
      - ./src:/app/src
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4"
        reservations:
          memory: 2g
          cpus: "1"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "celery",
          "-A",
          "src.celery_app",
          "inspect",
          "ping",
          "-d",
          "celery@$$HOSTNAME",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - internal
    restart: unless-stopped

  # ============================================
  # DB WRITER - PostgreSQL Writes
  # ============================================
  db_writer:
    image: celery-worker:latest
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=prefork
      --concurrency=${WRITER_CONCURRENCY:-2}
      -Q db_write
      -E
      -n db-writer@%h
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - ENV=${ENV:-development}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./src:/app/src
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
        reservations:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "celery",
          "-A",
          "src.celery_app",
          "inspect",
          "ping",
          "-d",
          "celery@$$HOSTNAME",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - internal
    restart: unless-stopped

  # ============================================
  # FLOWER - Monitoring Dashboard
  # ============================================
  flower:
    image: mher/flower
    command: celery flower --port=5555
    env_file:
      - .env
    environment:
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_AUTH:-admin:admin}
      - FLOWER_UNAUTHENTICATED_API=true
    ports:
      - "5555:5555"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - internal
    restart: unless-stopped

# Network - firma bazlı (project name ile oluşur)
networks:
  internal:
    external: true
    name: ${COMPOSE_PROJECT_NAME}-dev-network

volumes:
  celery_output:
