services:
  # Jaeger - OpenTelemetry tracing
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.11.0
    container_name: jaeger-preview
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "5778:5778" # Configuration server
      - "9411:9411" # Zipkin compatible endpoint
    restart: unless-stopped

  # Backend - preview servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Production Dockerfile
    env_file:
      - ./backend/.preview.env
    container_name: backend-preview
    ports:
      - "8000:8000" # preview port - production test
    environment:
      - PYTHONPATH=/code
      - ENV=preview
    restart: unless-stopped
    depends_on:
      - jaeger

  # Frontend - preview servisi
  frontend:
    depends_on:
      - backend
    build:
      context: ./frontend
      dockerfile: Dockerfile # Production Dockerfile
      args:
        - DEPLOYMENT_ENV=preview
    env_file:
      - ./frontend/.preview.env
    container_name: frontend-preview
    ports:
      - "8080:8080" # preview port - production test
    restart: unless-stopped

  # Neo4j ve Qdrant servisleri default bridge network üzerinde mevcut
  # Bu servisler kaldırıldı - mevcut servisler kullanılır

# Network tanımı kaldırıldı - default bridge network otomatik kullanılır
