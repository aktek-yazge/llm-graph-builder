services:
  # Backend - preview servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Production Dockerfile
    env_file:
      - ./backend/.preview.env
    container_name: backend-preview
    ports:
      - "8000:8000" # preview port - production test
    environment:
      - PYTHONPATH=/code
      - ENV=preview
    networks:
      - workspace_llm-graph-builder_net # DevContainer network kullan
    restart: unless-stopped

  # Frontend - preview servisi
  frontend:
    depends_on:
      - backend
    build:
      context: ./frontend
      dockerfile: Dockerfile # Production Dockerfile
      args:
        - DEPLOYMENT_ENV=preview
    env_file:
      - ./frontend/.preview.env
    container_name: frontend-preview
    ports:
      - "8080:8080" # preview port - production test
    networks:
      - workspace_llm-graph-builder_net # DevContainer network kullan
    restart: unless-stopped

  # Neo4j ve Qdrant servisleri DevContainer'dan kullanılacak
  # Bu servisler kaldırıldı - DevContainer'daki mevcut servisler kullanılır

# DevContainer network'ünü kullan - Neo4j ve Qdrant için
networks:
  workspace_llm-graph-builder_net:
    external: true

# Neo4j ve Qdrant volume'ları DevContainer'dan kullanılacak - kaldırıldı
volumes: {}
