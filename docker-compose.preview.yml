services:
  # Jaeger - OpenTelemetry tracing
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.11.0
    container_name: jaeger-preview
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "5778:5778" # Configuration server
      - "9411:9411" # Zipkin compatible endpoint
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=jaeger-preview"
    restart: unless-stopped

  # Backend - preview servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Production Dockerfile
    env_file:
      - ./backend/.preview.env
    container_name: backend-preview
    ports:
      - "8000:8000" # preview port - production test
    environment:
      - PYTHONPATH=/code
      - ENV=preview
      - QUEUE_DB_PATH=/code/backend/sqlite-data/queue.db
    volumes:
      # Persist queue.db in user's home directory - survives container/image deletion
      # Mount directory so Docker can auto-create the file
      # Backend will use QUEUE_DB_PATH environment variable to write to this location
      - ~/sqlite-db:/code/backend/sqlite-data
      # Persist output folder (documents, PDFs, images, markdown) - survives container/image deletion
      # Backend creates output/document_name/ structure with PDF, images, and markdown files
      - ~/llm-graph-output:/code/backend/output
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=backend-preview"
    restart: unless-stopped
    # depends_on:
    #   - jaeger

  # Frontend - preview servisi
  frontend:
    # depends_on:
    #   - backend
    build:
      context: ./frontend
      dockerfile: Dockerfile # Production Dockerfile
      args:
        - DEPLOYMENT_ENV=preview
    env_file:
      - ./frontend/.preview.env
    container_name: frontend-preview
    ports:
      - "5173:5173" # preview port - production test
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=frontend-preview"
    restart: unless-stopped

  # Neo4j ve Qdrant servisleri default bridge network üzerinde mevcut
  # Bu servisler kaldırıldı - mevcut servisler kullanılır
# Network tanımı kaldırıldı - default bridge network otomatik kullanılır
