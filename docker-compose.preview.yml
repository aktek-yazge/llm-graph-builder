services:
  # Jaeger - OpenTelemetry tracing
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.11.0
    container_name: jaeger-preview
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "5778:5778" # Configuration server
      - "9411:9411" # Zipkin compatible endpoint
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=jaeger-preview"
    networks:
      - preview
    restart: always

  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-preview
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      # Disable consumer timeout for long-running tasks (default is 30min = 1800000ms)
      # Use 'infinity' to completely disable, or high value like 7200000 (2 hours)
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit consumer_timeout infinity
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=rabbitmq-preview"
    networks:
      - preview
    restart: always

  # PostgreSQL - Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres-preview
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=llm_graph_builder
    # Increase max_connections for high concurrency workloads
    command: postgres -c max_connections=500 -c shared_buffers=512MB -c idle_in_transaction_session_timeout=0 -c statement_timeout=0
    volumes:
      # Host'ta sakla - docker volume'dan daha garanti, docker system prune'dan etkilenmez
      - ~/postgres-data-preview:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=postgres-preview"
    networks:
      - preview
    restart: always

  # Backend - preview servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Production Dockerfile
    env_file:
      - ./backend/.preview.env
    container_name: backend-preview
    ports:
      - "8000:8000" # preview port - production test
    environment:
      - PYTHONPATH=/code
      - ENV=preview
      - QUEUE_DB_PATH=/code/sqlite-data/queue.db
      - QUEUE_DB_URL=postgresql://postgres:postgres@postgres:5432/llm_graph_builder
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=db+postgresql://postgres:postgres@postgres:5432/llm_graph_builder
      # Neo4j Timeout ayarları - yoğun işlemler için artırıldı
      - NEO4J_CONNECTION_TIMEOUT=60
      - NEO4J_READ_TIMEOUT=300
      - NEO4J_WRITE_TIMEOUT=300
      - NEO4J_CONNECTION_ACQUISITION_TIMEOUT=120
    volumes:
      # TÜM BACKEND KLASÖRÜ MOUNT - restart ile değişiklikler uygulanır
      - ./backend:/code/backend
      # .venv container'da kalsın (host'a yazılmasın)
      - /code/backend/.venv
      # Persist queue.db - ayrı dizine mount (backend dışında)
      - ~/sqlite-db:/code/sqlite-data
      # Persist output folder (documents, PDFs, images, markdown) - survives container/image deletion
      # Backend creates output/document_name/ structure with PDF, images, and markdown files
      - ~/llm-graph-output:/code/output
      # Docker socket for system monitoring (docker stats)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=backend-preview"
    networks:
      - preview
    restart: always
    depends_on:
      - rabbitmq
      - postgres

  # Frontend - preview servisi
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile # Production Dockerfile
      args:
        - DEPLOYMENT_ENV=preview
    env_file:
      - ./frontend/.preview.env
    container_name: frontend-preview
    ports:
      - "5173:5173" # preview port - production test
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=frontend-preview"
    networks:
      - preview
    restart: always

  # Neo4j ve Qdrant servisleri harici olarak çalıştırılmalı
  # Bu servisler kaldırıldı - mevcut servisler kullanılır

networks:
  preview:
    driver: bridge

# Named volumes kaldırıldı - veriler host dizinlerinde saklanıyor
