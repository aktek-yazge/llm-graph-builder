[project]
name = "agent-builder-backend"
version = "0.2.0"
description = "Agent Builder Backend - LLM-driven agent creation platform with MCP Gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "neo4j>=5.15.0",
    "python-dotenv>=1.0.0",
    "celery>=5.3.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    # LLM providers
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.1.0",
    # Agent framework
    "deepagents>=0.4.0",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-postgres>=0.1.0",
    "langchain-mcp-adapters>=0.1.0",
    # Streaming
    "sse-starlette>=2.0.0",
    # JWT
    "PyJWT>=2.8.0",
    # Event Store
    "asyncpg>=0.29.0",
    # PDF → PNG conversion
    "PyMuPDF>=1.24.0",
    # MinIO object storage
    "minio>=7.2.0",
    # MCP Client for connecting to MCP services
    "fastmcp>=2.0.0",
    # ReactAgentV2 shared module dependencies
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "langfuse>=2.0.0",
    "redis>=5.0.0",
    "tiktoken>=0.7.0",
    # LangChain agent (create_agent, middleware)
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "aio-pika>=9.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
