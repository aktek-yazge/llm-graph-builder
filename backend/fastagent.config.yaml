# Please edit this configuration file to match your environment (on Windows).
# Examples in comments below - check/change the paths.
#
default_model: gpt-5-mini

logger:
  type: file
  level: debug
  show_chat: true # Show chat messages on console
  show_tools: true # Show MCP Server tool calls on console
  truncate_tools: false # Truncate long tool calls in display
  enable_markup: true # Disable if outputs conflict with rich library markup
mcp:
  servers:
    filesystem:
      # On windows update the command and arguments to use `node` and the absolute path to the server.
      # Use `npm i -g @modelcontextprotocol/server-filesystem` to install the server globally.
      # Use `npm -g root` to find the global node_modules path.`
      # command: "node"
      # args: ["c:/Program Files/nodejs/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js","."]
      command: 'npx'
      args: ['-y', '@modelcontextprotocol/server-filesystem', '.']
    fetch:
      command: 'uvx'
      args: ['mcp-server-fetch']

    # neo4j-database server (Cypher queries) - Local minimized version
    neo4j-database:
      command: 'python'
      timeout: 300000 # 5 minutes
      args:
        [
          '-m',
          'mcp_neo4j_cypher',
          '--transport',
          'stdio',
          '--db-url',
          'bolt://3.76.55.209:7687',
          '--username',
          'neo4j',
          '--password',
          'qwerty5555',
          '--database',
          'neo4j'
        ]
      cwd: 'mcp-servers/mcp-neo4j-cypher/src'

    # neo4j-memory server (Agent Memory Management)
    neo4j-memory:
      command: 'uvx'
      args: ['mcp-neo4j-memory@0.4.1']
      timeout: 300000 # 5 minutes
      env:
        NEO4J_URI: 'bolt://3.76.55.209:7687'
        NEO4J_USERNAME: 'neo4j'
        NEO4J_PASSWORD: 'qwerty5555'

    # embedding server (Cypher Embedding Generation)
    embedding:
      command: 'python3'
      args: ['mcp-servers/embedding/embedding_mcp_server.py']

otel:
  enabled: true
  otlp_endpoint: 'http://host.docker.internal:4318/v1/traces'

