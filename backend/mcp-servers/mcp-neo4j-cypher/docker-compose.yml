services:
  # MCP Neo4j Cypher Server
  mcp-neo4j-cypher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-neo4j-cypher
    restart: unless-stopped
    ports:
      - "${MCP_HTTP_PORT:-8002}:8002"
    environment:
      # Neo4j connection (varsayılanlar backend/.env'den override edilebilir)
      - NEO4J_URI=${NEO4J_URI:-bolt://host.docker.internal:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      # MCP Server settings
      - NEO4J_TRANSPORT=http
      - NEO4J_MCP_SERVER_HOST=0.0.0.0
      - NEO4J_MCP_SERVER_PORT=8002
      - NEO4J_MCP_SERVER_PATH=/mcp/
      - NEO4J_NAMESPACE=
      - NEO4J_MCP_SERVER_ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal
      - NEO4J_MCP_SERVER_ALLOW_ORIGINS=*
      - NEO4J_READ_TIMEOUT=30
      # Embedding için OpenAI (isteğe bağlı)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # 🔥 DOCKER COMPOSE WATCH - Otomatik dosya değişikliği izleme
    develop:
      watch:
        # Python kaynak kodları değişince -> sync + restart
        - action: sync+restart
          path: ./src
          target: /app/src
        # pyproject.toml değişince -> rebuild
        - action: rebuild
          path: ./pyproject.toml
        # utils.py değişince -> sadece sync (hot reload destekleniyorsa)
        - action: sync
          path: ./src/mcp_neo4j_cypher
          target: /app/src/mcp_neo4j_cypher
    
    healthcheck:
      # MCP server kontrolü - 406 beklenen yanıt (server çalışıyor demek)
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/mcp/ || [ $? -eq 22 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: mcp-network
