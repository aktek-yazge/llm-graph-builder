[project]
name = "backend-api"
version = "0.1.0"
description = "Lightweight FastAPI Backend for LLM Graph Builder"
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    # FastAPI Core
    "fastapi==0.115.12",
    "uvicorn==0.34.3",
    "gunicorn==23.0.0",
    "python-multipart==0.0.20",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "starlette==0.46.2",
    "sse-starlette==2.3.6",
    "fastapi-health==0.4.0",
    "itsdangerous==2.2.0",
    # Database
    "sqlalchemy==2.0.41",
    "psycopg2-binary==2.9.10",
    "asyncpg==0.30.0",
    "asyncio==3.4.3",
    "async-timeout==5.0.1",
    # Celery Client
    "celery==5.4.0",
    "flower==2.0.1",
    # Utilities
    "python-dotenv==1.1.0",
    "requests==2.32.5",
    "httpx==0.28.1",
    "aiohttp==3.12.15",
    "aiofiles==24.1.0",
    "pyyaml==6.0.3",
    "uuid-utils==0.12.0",
    "email-validator==2.3.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    # PDF Processing (for image extraction in upload)
    "PyMuPDF>=1.26.1",
    # AI & ML (for image processing)
    "torch==2.8.0",
    "torchvision==0.23.0",
    "pillow==11.3.0",
    "opencv-python==4.11.0.86",
    "youtube-transcript-api==1.2.3",
    # System Monitoring
    "psutil>=5.9.0",
    # Telemetry (Optional, keep if used in API)
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-requests",  # Outgoing HTTP calls tracing
    "opentelemetry-instrumentation-httpx",     # Async HTTP calls tracing (LangChain)
    "opentelemetry-exporter-otlp-proto-grpc",  # OTLP gRPC exporter for Tempo
    # LangChain Ecosystem (minimal - only for API endpoints, not processing)
    # NOT: deepagents için langchain-core 1.x gerekiyor
    "langchain==1.1.2",
    "langchain-core==1.1.1",
    "langchain-community==0.4.1",
    "langchain-neo4j==0.6.0",
    "langchain-openai==1.1.0",
    "langchain-anthropic==1.2.0",
    "langchain-google-vertexai==3.1.1",
    "langchain-groq==1.1.0",
    "langchain-huggingface==1.1.0",
    "langchain-aws==1.1.0",
    "langchain-text-splitters==1.0.0",
    "langchain-experimental==0.4.0",
    "langchain-mcp-adapters==0.1.14",
    # FastAgent MCP
    "fast-agent-mcp",
    # LangGraph Deep Agents
    "deepagents>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    # Redis for Semantic Caching and Chat Memory
    "redis>=5.0.0",
    "langchain-redis>=0.1.0",
    "redisvl>=0.3.0",
    "docling>=2.64.1",
    "secweb>=1.25.2",
    "pypdf2>=3.0.1",
    "pdf2image>=1.17.0",
    "langfuse>=3.11.1",
    "slowapi>=0.1.9",
]
