services:
  # Backend - Staging servisi
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .staging.env
    container_name: backend-staging
    ports:
      - "8001:8000"
    environment:
      - PYTHONPATH=/code
      - ENV=staging
      - QUEUE_DB_PATH=/code/backend/sqlite-data/queue.db
      # OpenTelemetry - Observability entegrasyonu
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=llm-graph-builder-backend
      - OTEL_ENVIRONMENT=staging
    volumes:
      - ~/sqlite-db:/code/backend/sqlite-data
      - ~/llm-graph-output:/code/backend/output
      # Logs klasörü - Alloy tarafından okunacak
      - ./logs:/code/backend/logs
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - workspace_llm-graph-builder_net
      - observability
    restart: unless-stopped

  # Frontend - Staging servisi
  frontend:
    depends_on:
      - backend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - DEPLOYMENT_ENV=staging
    env_file:
      - ../frontend/.staging.env
    container_name: frontend-staging
    ports:
      - "8080:8080"
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - workspace_llm-graph-builder_net
      - observability
    restart: unless-stopped

networks:
  workspace_llm-graph-builder_net:
    external: true
  observability:
    external: true
    name: observability

volumes: {}










