services:
  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-preview
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit consumer_timeout infinity
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - preview
      - observability
    restart: always

  # PostgreSQL - Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres-preview
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Ekdmjweu483i
      - POSTGRES_DB=llm_graph_builder
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    volumes:
      - ~/postgres-data-preview:/var/lib/postgresql/data
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - preview
      - observability
    restart: always

  # Backend - preview servisi
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .preview.env
    container_name: backend-preview
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/code
      - ENV=preview
      - QUEUE_DB_PATH=/code/sqlite-data/queue.db
      - QUEUE_DB_URL=postgresql://postgres:Ekdmjweu483i@postgres:5432/llm_graph_builder
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=db+postgresql://postgres:Ekdmjweu483i@postgres:5432/llm_graph_builder
      # Neo4j Timeout ayarları
      - NEO4J_CONNECTION_TIMEOUT=60
      - NEO4J_READ_TIMEOUT=300
      - NEO4J_WRITE_TIMEOUT=300
      - NEO4J_CONNECTION_ACQUISITION_TIMEOUT=120
      # MCP Server bağlantısı
      - MCP_HTTP_HOST=mcp-neo4j-cypher
      - MCP_HTTP_PORT=8002
      # OpenTelemetry - Observability entegrasyonu
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=llm-graph-builder-backend
      - OTEL_ENVIRONMENT=preview
    volumes:
      # TÜM BACKEND KLASÖRÜ MOUNT
      - .:/code/backend
      - /code/backend/.venv
      - ~/sqlite-db:/code/sqlite-data
      - ~/llm-graph-output:/code/output
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Logs klasörü - Alloy tarafından okunacak
      - ./logs:/code/backend/logs
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - preview
      - observability
    restart: always
    depends_on:
      - rabbitmq
      - postgres

  # Frontend - preview servisi
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - DEPLOYMENT_ENV=preview
    env_file:
      - ../frontend/.preview.env
    container_name: frontend-preview
    ports:
      - "5173:5173"
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - preview
      - observability
    restart: always

networks:
  preview:
    driver: bridge
  observability:
    external: true
    name: observability


