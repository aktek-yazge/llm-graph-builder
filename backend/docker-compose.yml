services:
  # Backend - Production servisi
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: backend-prod
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/code
      - ENV=production
      - QUEUE_DB_PATH=/code/backend/sqlite-data/queue.db
      - QUEUE_DB_URL=postgresql://postgres:Ekdmjweu483i@postgres:5432/llm_graph_builder
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=db+postgresql://postgres:Ekdmjweu483i@postgres:5432/llm_graph_builder
      # OpenTelemetry - Observability entegrasyonu
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_SERVICE_NAME=llm-graph-builder-backend
      - OTEL_ENVIRONMENT=production
    volumes:
      - ~/sqlite-db:/code/backend/sqlite-data
      - llm-graph-output-prod:/code/backend/output
      # Logs klasörü - Alloy tarafından okunacak
      - ./logs:/code/backend/logs
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - llm-graph-builder_prod
      - observability
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - neo4j
      - postgres
      - redis

  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-prod
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit consumer_timeout infinity
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - llm-graph-builder_prod
      - observability
    restart: unless-stopped

  # PostgreSQL - Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Ekdmjweu483i
      - POSTGRES_DB=llm_graph_builder
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    volumes:
      - ~/postgres-data-prod:/var/lib/postgresql/data
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - llm-graph-builder_prod
      - observability
    restart: unless-stopped

  # Redis Stack Server
  redis:
    image: redis/redis-stack-server:7.4.0-v2
    container_name: redis-prod
    hostname: redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - llm-graph-builder_prod
      - observability
    restart: unless-stopped

  # Frontend - Production servisi
  frontend:
    depends_on:
      - backend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - DEPLOYMENT_ENV=prod
    env_file:
      - ../frontend/.env
    container_name: frontend-prod
    ports:
      - "8080:8080"
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - llm-graph-builder_prod
      - observability
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-service-prod
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage_prod:/qdrant/storage
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "4"
    networks:
      - llm-graph-builder_prod
      - observability

  neo4j:
    image: neo4j:2025.07.1
    container_name: neo4j-service-prod
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/qwerty5555
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=4G
      - NEO4J_server_memory_heap_max__size=8G
      - NEO4J_server_memory_pagecache_size=4G
      - NEO4J_dbms_memory_transaction_total_max=16G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_server_jvm_additional=--add-modules=jdk.incubator.vector
    deploy:
      resources:
        limits:
          memory: 20g
          cpus: "6"
    volumes:
      - neo4j_data_prod:/data
      - neo4j_plugins_prod:/plugins
      - neo4j_import_prod:/var/lib/neo4j/import
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - llm-graph-builder_prod
      - observability

  neo4j_2:
    image: neo4j:2025.07.1
    container_name: neo4j-service-prod-2
    restart: always
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/qwerty5555
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=24G
      - NEO4J_server_memory_heap_max__size=32G
      - NEO4J_server_memory_pagecache_size=56G
      - NEO4J_dbms_memory_transaction_total_max=24G
      - NEO4J_db_transaction_timeout=5m
      - NEO4J_dbms_transaction_timeout=5m
      - NEO4J_dbms_lock_acquisition_timeout=2m
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_server_jvm_additional=--add-modules=jdk.incubator.vector
    deploy:
      resources:
        limits:
          memory: 110g
          cpus: "14"
    volumes:
      - neo4j_data_prod_2:/data
      - neo4j_plugins_prod_2:/plugins
      - neo4j_import_prod_2:/var/lib/neo4j/import
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - llm-graph-builder_prod
      - observability

networks:
  llm-graph-builder_prod:
    driver: bridge
  observability:
    external: true
    name: observability

volumes:
  qdrant_storage_prod:
  neo4j_data_prod:
  neo4j_plugins_prod:
  neo4j_import_prod:
  neo4j_data_prod_2:
  neo4j_plugins_prod_2:
  neo4j_import_prod_2:
  llm-graph-output-prod:
  redis_data_prod:


