# =============================================================================
# TRAEFIK - Reverse Proxy & Load Balancer
# =============================================================================
# Tüm HTTP servislerini tek port üzerinden yönetir
# Container label'larından routing kurallarını otomatik okur
#
# Kullanım:
#   docker-compose up -d
#
# Dashboard:
#   http://localhost:8080/dashboard/
#
# DNS Ayarı (/etc/hosts):
#   127.0.0.1   wat.local
#   127.0.0.1   aksa.local
#   127.0.0.1   kormas.local
# =============================================================================

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: always
    command:
      # API ve Dashboard
      - "--api.insecure=true"
      - "--api.dashboard=true"
      
      # Docker provider - container label'larını dinle
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
    
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS (opsiyonel)
      - "8090:8080"   # Traefik Dashboard (8080 meşgul olabilir)
      # Neo4j Bolt portu kaldırıldı - mevcut Neo4j'ler çakışıyor
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    
    networks:
      - traefik-public
    
    labels:
      # Dashboard routing (opsiyonel - traefik.local üzerinden erişim)
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.local`)"
      - "traefik.http.routers.dashboard.service=api@internal"

networks:
  traefik-public:
    external: true
    name: traefik-public
