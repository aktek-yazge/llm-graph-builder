# =============================================================================
# AKKOK-SİCİL - Staging/Preview Deployment Stack
# =============================================================================
#
# ÖN KOŞUL:
#   Infrastructure stack çalışıyor olmalı:
#   cd ../infrastructure && docker compose -p infrastructure up -d
#
# KULLANIM:
#   # Infisical ile çalıştırma (önerilen)
#   infisical run --env=staging --path=/tenants/akkok-sicil -- \
#     docker compose -p akkok-sicil -f docker-compose.staging.yml up -d
#
#   # Manuel .env dosyası ile
#   docker compose -p akkok-sicil -f docker-compose.staging.yml --env-file .env up -d
#
# ERİŞİM (Traefik path-based routing):
#   Frontend:  https://akkok-sicil.yazge.aktekbilisim.com
#   Backend:   https://akkok-sicil.yazge.aktekbilisim.com/server
#   Neo4j:     https://akkok-sicil.yazge.aktekbilisim.com/neo4j
#   pgAdmin:   https://akkok-sicil.yazge.aktekbilisim.com/pgadmin
#   Flower:    https://akkok-sicil.yazge.aktekbilisim.com/flower
#
# SHARED SERVİSLER (infrastructure stack):
#   RabbitMQ:  https://rabbitmq.yazge.aktekbilisim.com
#
# GEREKLİ ENV DEĞİŞKENLERİ:
#   TENANT_DOMAIN, POSTGRES_PASSWORD, NEO4J_PASSWORD, RABBITMQ_PASSWORD
#   OPENAI_API_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   (Tam liste için README.md'ye bakın)
#
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL - Database with pgvector
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: akkok-sicil-postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-llm_graph_builder}
    command: postgres -c max_connections=2000 -c shared_buffers=512MB -c effective_cache_size=2GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - internal
      - observability
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # pgAdmin - PostgreSQL Web UI
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: akkok-sicil-pgadmin
    expose:
      - "80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@akkok.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - SCRIPT_NAME=/pgadmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "logging=alloy"
      - "traefik.enable=true"
      - "traefik.http.routers.akkok-sicil-pgadmin.rule=Host(`${TENANT_DOMAIN}`) && PathPrefix(`/pgadmin`)"
      - "traefik.http.routers.akkok-sicil-pgadmin.entrypoints=web,websecure"
      - "traefik.http.routers.akkok-sicil-pgadmin.priority=20"
      - "traefik.http.services.akkok-sicil-pgadmin.loadbalancer.server.port=80"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - internal
      - observability
      - traefik-public
    restart: always

  # ===========================================================================
  # Redis - Cache & Semantic Search
  # ===========================================================================
  redis:
    image: redis/redis-stack-server:7.4.0-v2
    container_name: akkok-sicil-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    networks:
      - internal
      - observability
    restart: always

  # ===========================================================================
  # Neo4j - Graph Database
  # ===========================================================================
  neo4j:
    image: neo4j:2025.07.1
    container_name: akkok-sicil-neo4j
    restart: always
    expose:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=2G
      - NEO4J_server_memory_heap_max__size=4G
      - NEO4J_server_memory_pagecache_size=2G
      - NEO4J_dbms_memory_transaction_total_max=4G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_server_jvm_additional=--add-modules=jdk.incubator.vector
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
      - neo4j_import:/var/lib/neo4j/import
    labels:
      - "logging=alloy"
      - "traefik.enable=true"
      - "traefik.http.routers.akkok-sicil-neo4j.rule=Host(`${TENANT_DOMAIN}`) && PathPrefix(`/neo4j`)"
      - "traefik.http.routers.akkok-sicil-neo4j.entrypoints=web,websecure"
      - "traefik.http.routers.akkok-sicil-neo4j.priority=15"
      - "traefik.http.services.akkok-sicil-neo4j.loadbalancer.server.port=7474"
      - "traefik.http.middlewares.akkok-sicil-strip-neo4j.stripprefix.prefixes=/neo4j"
      - "traefik.http.middlewares.akkok-sicil-redirect-neo4j.redirectregex.regex=^(https?://[^/]+/neo4j)$$"
      - "traefik.http.middlewares.akkok-sicil-redirect-neo4j.redirectregex.replacement=$${1}/browser/"
      - "traefik.http.middlewares.akkok-sicil-redirect-neo4j.redirectregex.permanent=false"
      - "traefik.http.routers.akkok-sicil-neo4j.middlewares=akkok-sicil-redirect-neo4j,akkok-sicil-strip-neo4j"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - internal
      - observability
      - traefik-public

  # ===========================================================================
  # MCP Neo4j Cypher Server
  # ===========================================================================
  mcp-neo4j-cypher:
    build:
      context: ../../mcp-servers/mcp-neo4j-cypher
      dockerfile: Dockerfile
    container_name: akkok-sicil-mcp
    restart: always
    expose:
      - "8002"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8002
      - NEO4J_TRANSPORT=http
      - NEO4J_MCP_SERVER_HOST=0.0.0.0
      - NEO4J_MCP_SERVER_PORT=8002
      - NEO4J_MCP_SERVER_PATH=/mcp/
      - NEO4J_MCP_SERVER_ALLOWED_HOSTS=localhost,127.0.0.1,mcp-neo4j-cypher,backend
      - NEO4J_MCP_SERVER_ALLOW_ORIGINS=*
      - NEO4J_READ_TIMEOUT=30
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    labels:
      - "logging=alloy"
      - "traefik.enable=true"
      - "traefik.http.routers.akkok-sicil-mcp.rule=Host(`${TENANT_DOMAIN}`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.akkok-sicil-mcp.entrypoints=web,websecure"
      - "traefik.http.routers.akkok-sicil-mcp.priority=20"
      - "traefik.http.services.akkok-sicil-mcp.loadbalancer.server.port=8002"
      - "traefik.http.middlewares.akkok-sicil-strip-mcp.stripprefix.prefixes=/mcp"
      - "traefik.http.routers.akkok-sicil-mcp.middlewares=akkok-sicil-strip-mcp"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - observability
      - traefik-public
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:8002/mcp/ -X POST -H ''Content-Type: application/json'' -d ''{"jsonrpc":"2.0","id":1,"method":"tools/list"}'' | grep -q result',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - neo4j

  # ===========================================================================
  # Backend - FastAPI Application
  # ===========================================================================
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: akkok-sicil-backend
    expose:
      - "8000"
    environment:
      - PYTHONPATH=/code
      - ENV=staging
      # Database Connections
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_graph_builder}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-rabbitmq}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=db+postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_graph_builder}
      - REDIS_URL=redis://redis:6379
      - REDIS_SEMANTIC_URL=redis://redis:6379
      # Neo4j Timeout Settings
      - NEO4J_CONNECTION_TIMEOUT=60
      - NEO4J_READ_TIMEOUT=300
      - NEO4J_WRITE_TIMEOUT=300
      - NEO4J_CONNECTION_ACQUISITION_TIMEOUT=120
      # MCP Server
      - MCP_HTTP_HOST=mcp-neo4j-cypher
      - MCP_HTTP_PORT=8002
      # Output Directory (shared with Celery)
      - OUTPUT_DIR=output
      # LLM API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # LLM Model Configurations
      - LLM_MODEL_CONFIG_openai_gpt_4o_mini=${LLM_MODEL_CONFIG_openai_gpt_4o_mini}
      - LLM_MODEL_CONFIG_openai_gpt_4o=${LLM_MODEL_CONFIG_openai_gpt_4o}
      - LLM_MODEL_CONFIG_gemini_2.0_flash=${LLM_MODEL_CONFIG_gemini_2.0_flash}
      # AWS S3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - S3_BACKUP_BUCKET=${S3_BUCKET_NAME}
      # Langfuse Observability
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-true}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      - OTEL_SERVICE_NAME=akkok-sicil-backend
      - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-staging}
      # Authentication
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-168}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # REACT Agent
      - USE_REACT_AGENT=${USE_REACT_AGENT:-true}
      - REACT_MODEL=${REACT_MODEL:-gpt-4o}
      - REACT_TOOL_MODE=${REACT_TOOL_MODE:-cypher}
      - REACT_DOMAIN=akkok-sicil
      # Embedding & Processing
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-openai}
      - IS_EMBEDDING=TRUE
      - KNN_MIN_SCORE=0.94
      - V2_BATCH_SIZE=${V2_BATCH_SIZE:-10}
    volumes:
      - backend_output:/code/output
      - backend_logs:/code/logs
      - backend_findings:/code/agent_findings
    labels:
      - "logging=alloy"
      - "traefik.enable=true"
      - "traefik.http.routers.akkok-sicil-backend.rule=Host(`${TENANT_DOMAIN}`) && PathPrefix(`/server`)"
      - "traefik.http.routers.akkok-sicil-backend.entrypoints=web,websecure"
      - "traefik.http.routers.akkok-sicil-backend.priority=20"
      - "traefik.http.services.akkok-sicil-backend.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.akkok-sicil-strip-server.stripprefix.prefixes=/server"
      - "traefik.http.routers.akkok-sicil-backend.middlewares=akkok-sicil-strip-server"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
    networks:
      - internal
      - infrastructure
      - observability
      - traefik-public
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_healthy

  # ===========================================================================
  # Celery Main Worker - Chunking, Graph, Embeddings
  # ===========================================================================
  celery-main-worker:
    build:
      context: ../../celery_worker
      dockerfile: Dockerfile
    container_name: akkok-sicil-celery-main
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=prefork
      --autoscale=16,4
      -Q celery
      -E
      -n main-worker@%h
    environment:
      - PYTHONPATH=/app
      - ENV=staging
      - OUTPUT_DIR=output
      # Database Connections
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_graph_builder}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-rabbitmq}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=db+postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_graph_builder}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - REDIS_URL=redis://redis:6379
      # LLM API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # LLM Model Configurations
      - LLM_MODEL_CONFIG_openai_gpt_4o_mini=${LLM_MODEL_CONFIG_openai_gpt_4o_mini}
      - LLM_MODEL_CONFIG_openai_gpt_4o=${LLM_MODEL_CONFIG_openai_gpt_4o}
      - LLM_MODEL_CONFIG_gemini_2.0_flash=${LLM_MODEL_CONFIG_gemini_2.0_flash}
      # AWS S3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      # Langfuse Observability
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-true}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
    volumes:
      - celery_output:/app/output
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "8"
        reservations:
          memory: 4g
          cpus: "2"
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - internal
      - infrastructure
      - observability
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started

  # ===========================================================================
  # Celery DB Writer - PostgreSQL Writes
  # ===========================================================================
  celery-db-writer:
    build:
      context: ../../celery_worker
      dockerfile: Dockerfile
    container_name: akkok-sicil-celery-db
    command: >
      python -m celery -A src.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --pool=prefork
      --concurrency=2
      -Q db_write
      -E
      -n db-writer@%h
    environment:
      - PYTHONPATH=/app
      - ENV=staging
      - OUTPUT_DIR=output
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_graph_builder}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-rabbitmq}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=db+postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_graph_builder}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"
        reservations:
          memory: 1g
          cpus: "0.5"
    labels:
      - "logging=alloy"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - internal
      - infrastructure
      - observability
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # Flower - Celery Monitoring Dashboard
  # ===========================================================================
  flower:
    image: mher/flower
    container_name: akkok-sicil-flower
    command: celery flower --port=5555
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-rabbitmq}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_AUTH:-admin:admin}
      - FLOWER_UNAUTHENTICATED_API=true
    expose:
      - "5555"
    labels:
      - "logging=alloy"
      - "traefik.enable=true"
      - "traefik.http.routers.akkok-sicil-flower.rule=Host(`${TENANT_DOMAIN}`) && PathPrefix(`/flower`)"
      - "traefik.http.routers.akkok-sicil-flower.entrypoints=web,websecure"
      - "traefik.http.routers.akkok-sicil-flower.priority=20"
      - "traefik.http.services.akkok-sicil-flower.loadbalancer.server.port=5555"
      - "traefik.http.middlewares.akkok-sicil-strip-flower.stripprefix.prefixes=/flower"
      - "traefik.http.routers.akkok-sicil-flower.middlewares=akkok-sicil-strip-flower"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - internal
      - infrastructure
      - observability
      - traefik-public
    restart: always
    # RabbitMQ infrastructure stack'te çalışır - bağımlılık yok

  # ===========================================================================
  # Frontend - React Application
  # ===========================================================================
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        - DEPLOYMENT_ENV=staging
    container_name: akkok-sicil-frontend
    expose:
      - "5173"
    environment:
      - VITE_API_URL=/server
    labels:
      - "logging=alloy"
      - "traefik.enable=true"
      - "traefik.http.routers.akkok-sicil-frontend.rule=Host(`${TENANT_DOMAIN}`)"
      - "traefik.http.routers.akkok-sicil-frontend.entrypoints=web,websecure"
      - "traefik.http.routers.akkok-sicil-frontend.priority=10"
      - "traefik.http.services.akkok-sicil-frontend.loadbalancer.server.port=5173"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - internal
      - observability
      - traefik-public
    restart: always
    depends_on:
      - backend

networks:
  internal:
    driver: bridge
  infrastructure:
    external: true
    name: infrastructure_infrastructure
  observability:
    external: true
    name: observability
  traefik-public:
    external: true
    name: traefik-public

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  neo4j_data:
  neo4j_plugins:
  neo4j_import:
  backend_output:
  backend_logs:
  backend_findings:
  celery_output:
