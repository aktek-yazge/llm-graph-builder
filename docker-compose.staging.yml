services:
  # Backend - Staging servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Production Dockerfile
    env_file:
      - ./backend/.staging.env
    container_name: backend-staging
    ports:
      - "8001:8000" # Staging port - production test
    environment:
      - PYTHONPATH=/code
      - ENV=staging
      - QUEUE_DB_PATH=/code/backend/sqlite-data/queue.db
    volumes:
      # Persist queue.db in user's home directory - survives container/image deletion
      # Mount directory so Docker can auto-create the file
      # Backend will use QUEUE_DB_PATH environment variable to write to this location
      - ~/sqlite-db:/code/backend/sqlite-data
      # Persist output folder (documents, PDFs, images, markdown) - survives container/image deletion
      # Backend creates output/document_name/ structure with PDF, images, and markdown files
      - ~/llm-graph-output:/code/backend/output
    networks:
      - workspace_llm-graph-builder_net # DevContainer network kullan
    restart: unless-stopped

  # Frontend - Staging servisi
  frontend:
    depends_on:
      - backend
    build:
      context: ./frontend
      dockerfile: Dockerfile # Production Dockerfile
      args:
        - DEPLOYMENT_ENV=staging
    env_file:
      - ./frontend/.staging.env
    container_name: frontend-staging
    ports:
      - "8080:8080" # Staging port - production test
    networks:
      - workspace_llm-graph-builder_net # DevContainer network kullan
    restart: unless-stopped

  # Neo4j ve Qdrant servisleri DevContainer'dan kullanılacak
  # Bu servisler kaldırıldı - DevContainer'daki mevcut servisler kullanılır

# DevContainer network'ünü kullan - Neo4j ve Qdrant için
networks:
  workspace_llm-graph-builder_net:
    external: true

# Neo4j ve Qdrant volume'ları DevContainer'dan kullanılacak - kaldırıldı
volumes: {}
