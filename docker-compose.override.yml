# Production override - backend ve frontend production servisleri
# Ana compose'da sadece database servisleri var, production servisleri burada

services:
  # Backend - Production servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Production Dockerfile
    env_file:
      - ./backend/.env
    container_name: backend
    ports:
      - '8000:8000'
    environment:
      - PYTHONPATH=/code
      - ENV=production
    networks:
      - llm-graph-builder_net
    restart: unless-stopped

  # Frontend - Production servisi
  frontend:
    depends_on:
      - backend
    build:
      context: ./frontend
      dockerfile: Dockerfile # Production Dockerfile
      args:
        - VITE_BACKEND_API_URL=${VITE_BACKEND_API_URL-http://localhost:8000}
        - VITE_REACT_APP_SOURCES=${VITE_REACT_APP_SOURCES-local,wiki,s3}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID-}
        - VITE_BLOOM_URL=${VITE_BLOOM_URL-https://workspace-preview.neo4j.io/workspace/explore?connectURL={CONNECT_URL}&search=Show+me+a+graph&featureGenAISuggestions=true&featureGenAISuggestionsInternal=true}
        - VITE_TIME_PER_PAGE=${VITE_TIME_PER_PAGE-50}
        - VITE_CHUNK_SIZE=${VITE_CHUNK_SIZE-5242880}
        - VITE_LARGE_FILE_SIZE=${VITE_LARGE_FILE_SIZE-5242880}
        - VITE_ENV=${VITE_ENV-PROD}
        - VITE_CHAT_MODES=${VITE_CHAT_MODES-}
        - VITE_BATCH_SIZE=${VITE_BATCH_SIZE-2}
        - VITE_LLM_MODELS=${VITE_LLM_MODELS-}
        - VITE_LLM_MODELS_PROD=${VITE_LLM_MODELS_PROD-openai_gpt_4o,openai_gpt_4o_mini,diffbot,gemini_1.5_flash}
        - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN-}
        - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID-}
        - VITE_DISABLE_AUTH=${VITE_DISABLE_AUTH-false}
        - VITE_CHUNK_OVERLAP=${VITE_CHUNK_OVERLAP-20}
        - VITE_TOKENS_PER_CHUNK=${VITE_TOKENS_PER_CHUNK-200}
        - VITE_CHUNK_TO_COMBINE=${VITE_CHUNK_TO_COMBINE-1}
        - DEPLOYMENT_ENV=production
    env_file:
      - ./frontend/.env
    container_name: frontend
    ports:
      - '8080:8080' # Production port
    networks:
      - llm-graph-builder_net
    restart: unless-stopped

