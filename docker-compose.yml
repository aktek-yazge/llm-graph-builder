services:
  # Backend - Production servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Production Dockerfile
    env_file:
      - ./backend/.env
    container_name: backend-prod
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/code
      - ENV=production
      - QUEUE_DB_PATH=/code/backend/sqlite-data/queue.db
      - QUEUE_DB_URL=postgresql://postgres:postgres@postgres:5432/llm_graph_builder
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=db+postgresql://postgres:postgres@postgres:5432/llm_graph_builder
    volumes:
      # Persist queue.db in user's home directory - survives container/image deletion
      # Mount directory so Docker can auto-create the file
      # Backend will use QUEUE_DB_PATH environment variable to write to this location
      - ~/sqlite-db:/code/backend/sqlite-data
      # Persist output folder (documents, PDFs, images, markdown) - survives container/image deletion
      # Backend creates output/document_name/ structure with PDF, images, and markdown files
      - llm-graph-output-prod:/code/backend/output
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=backend-prod"
    networks:
      - llm-graph-builder_prod
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - neo4j
      - postgres

  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-prod
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=rabbitmq-prod"
    networks:
      - llm-graph-builder_prod
    restart: unless-stopped

  # PostgreSQL - Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=llm_graph_builder
    # Increase max_connections for high concurrency workloads
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=postgres-prod"
    networks:
      - llm-graph-builder_prod
    restart: unless-stopped

  # Celery Worker - Background Tasks
  celery_worker:
    build:
      context: ./celery_worker
      dockerfile: Dockerfile
    container_name: celery-worker-prod
    command: uv run celery -A src.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/code
      - ENV=production
      - QUEUE_DB_URL=postgresql://postgres:postgres@postgres:5432/llm_graph_builder
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=db+postgresql://postgres:postgres@postgres:5432/llm_graph_builder
    volumes:
      - ~/sqlite-db:/code/backend/sqlite-data
      - llm-graph-output-prod:/code/backend/output
    depends_on:
      - backend
      - rabbitmq
      - neo4j
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=celery-worker-prod"
    networks:
      - llm-graph-builder_prod
    restart: unless-stopped

  # Flower - Celery Dashboard
  flower:
    image: mher/flower
    container_name: flower-prod
    command: celery flower
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - FLOWER_PORT=5555
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
      - celery_worker
    networks:
      - llm-graph-builder_prod
    restart: unless-stopped

  # Frontend - Production servisi
  frontend:
    depends_on:
      - backend
    build:
      context: ./frontend
      dockerfile: Dockerfile # Production Dockerfile
      args:
        - DEPLOYMENT_ENV=prod
    env_file:
      - ./frontend/.env
    container_name: frontend-prod
    ports:
      - "8080:8080" # Production port
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=frontend-prod"
    networks:
      - llm-graph-builder_prod
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-service-prod
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage_prod:/qdrant/storage
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=qdrant-service-prod"
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "4"
    networks:
      - llm-graph-builder_prod

  neo4j:
    image: neo4j:2025.07.1
    container_name: neo4j-service-prod
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/qwerty5555
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "4"
    volumes:
      - neo4j_data_prod:/data
      - neo4j_plugins_prod:/plugins
      - neo4j_import_prod:/var/lib/neo4j/import
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=neo4j-service-prod"
    networks:
      - llm-graph-builder_prod

  neo4j_2:
    image: neo4j:2025.07.1
    container_name: neo4j-service-prod-2
    restart: always
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/qwerty5555
      - NEO4J_PLUGINS=["apoc","graph-data-science","apoc-extended"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "4"
    volumes:
      - neo4j_data_prod_2:/data
      - neo4j_plugins_prod_2:/plugins
      - neo4j_import_prod_2:/var/lib/neo4j/import
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "10"
        labels: "container_name=neo4j-service-prod-2"
    networks:
      - llm-graph-builder_prod

networks:
  llm-graph-builder_prod:
    driver: bridge

volumes:
  qdrant_storage_prod:
  neo4j_data_prod:
  neo4j_plugins_prod:
  neo4j_import_prod:
  neo4j_data_prod_2:
  neo4j_plugins_prod_2:
  neo4j_import_prod_2:
  llm-graph-output-prod:
  postgres_data_prod:
